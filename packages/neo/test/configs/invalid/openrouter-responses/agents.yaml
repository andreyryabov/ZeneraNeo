# An api named in the *shorthand*, on a kind that has only one.
#
# `openrouter` speaks its own protocol, so there is no api to choose. Unlike
# invalid/api-on-single-api-vendor, which says so with an `api:` key, the
# mistake here is inside a ref — and the shorthand parser knows the word
# `responses`, so this survives parsing and fails when the model is built.
# Listing an api here instead would trade that for a 404 from the gateway.
version: 1

agents:
    - name: solo
      model: openrouter/responses:openai/gpt-5.4-nano
