# One key and one endpoint in front of every vendor.
#
# `kind: openrouter` is a protocol of its own, not the `openai-compatible` shim
# with two constants filled in: the gateway's own SDK carries the things chat
# completions cannot say — which upstream provider serves a request, what to
# try when it cannot, and what the call cost — so it gets its own adapter.
# Point `openai-compatible` at the same base url for the older, laxer client.
version: 1

providers:
    # Declared only to carry the attribution headers OpenRouter credits apps
    # by. There is no dedicated field for them and there does not need to be:
    # `headers:` is already "sent on every request".
    attributed:
        kind: openrouter
        headers:
            HTTP-Referer: https://zenera.example
            X-Title: Zenera Neo

    # A second key against the same gateway, declared the way any vendor takes
    # one — a separate name is a separate client.
    spare:
        kind: openrouter
        apiKey: ${ZN_OPENROUTER_KEY}

models:
    sonnet:
        provider: attributed
        model: anthropic/claude-sonnet-4.5
        # Sent as `reasoning.effort`. One spelling covers vendors that each
        # name the dial differently, because the gateway maps it onto whatever
        # the destination model understands — a pass-through for OpenAI's
        # models, a fraction of the thinking budget for the rest.
        reasoningEffort: high

    nano:
        # `openrouter` is undeclared above, and resolves anyway: a built-in
        # kind is usable as a provider *name*. This entry is complete.
        provider: openrouter
        # There is no `api:` here, and naming one is a load error: this kind
        # speaks one protocol, its own. See invalid/.
        model: openai/gpt-5.4-nano

    # The two knobs the gateway exists for, and the reason it is no longer a
    # shim: `routing` says who may serve the request, `fallbacks` says what to
    # try when none of them can.
    routed:
        provider: openrouter
        model: openai/gpt-5.4-nano
        routing:
            order: [azure, openai]
            # Refuse a provider that would quietly ignore a parameter rather
            # than serving a request that means something else than it says.
            requireParameters: true
            sort: throughput
        fallbacks:
            - anthropic/claude-sonnet-4.5
            - google/gemini-3.5-flash

agents:
    - name: careful
      model: sonnet

    - name: cheap
      model: nano

    - name: routed
      model: routed

    # Ids are `vendor/model`, and the vendor prefix is part of the *id* — the
    # provider is what precedes the first colon, not what precedes the slash.
    - name: bare
      model: openrouter:google/gemini-3.5-flash

    # A variant suffix (`:free`, `:nitro`, `:floor`) carries a colon of its
    # own and survives the shorthand, because only the first colon separates.
    - name: free
      model: openrouter:z-ai/glm-5.2:free

    - name: spare-key
      model: spare:x-ai/grok-4:nitro
