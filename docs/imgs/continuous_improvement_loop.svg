<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1080" viewBox="0 0 1000 1080" role="img" aria-labelledby="title desc">
  <title id="title">Continuous specification improvement loop</title>
  <desc id="desc">A strict technical architecture diagram showing how source material is compiled into SPECIFICATION.md, used to configure an agent runtime, executed in sandbox runs, evaluated by trajectory analysis, and fed back as specification updates.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path class="arrow-fill" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
    <marker id="feedbackArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path class="feedback-fill" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
    <style>
      svg {
        background: transparent;
      }
      .title {
        font: 700 31px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        fill: #0f172a;
      }
      .subtitle {
        font: 500 15px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        fill: #475569;
      }
      .canvas {
        fill: #ffffff;
      }
      .box {
        fill: #ffffff;
        stroke: #334155;
        stroke-width: 2;
      }
      .box-muted {
        fill: #f8fafc;
        stroke: #64748b;
        stroke-width: 1.5;
      }
      .stage {
        font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        letter-spacing: 0.08em;
        fill: #475569;
      }
      .heading {
        font: 700 20px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        fill: #0f172a;
      }
      .mono {
        font: 700 18px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        fill: #0f172a;
      }
      .body {
        font: 500 15px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        fill: #334155;
      }
      .small {
        font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        fill: #475569;
      }
      .edge {
        fill: none;
        stroke: #334155;
        stroke-width: 2.75;
        stroke-linecap: square;
        stroke-linejoin: miter;
        marker-end: url(#arrow);
      }
      .edge-soft {
        fill: none;
        stroke: #64748b;
        stroke-width: 2;
        stroke-linecap: square;
        stroke-linejoin: miter;
      }
      .feedback {
        fill: none;
        stroke: #b45309;
        stroke-width: 2.75;
        stroke-linecap: square;
        stroke-linejoin: miter;
        stroke-dasharray: 10 8;
        marker-end: url(#feedbackArrow);
      }
      .chip {
        fill: #f8fafc;
        stroke: #94a3b8;
        stroke-width: 1.25;
      }
      .chip-text {
        font: 650 12px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        fill: #334155;
      }
      .accent {
        fill: #b45309;
      }
      .arrow-fill {
        fill: #334155;
      }
      .feedback-fill {
        fill: #b45309;
      }
      @media (prefers-color-scheme: dark) {
        .canvas {
          fill: #020617;
        }
        .title, .heading, .mono {
          fill: #e2e8f0;
        }
        .subtitle, .stage, .body, .small, .chip-text {
          fill: #cbd5e1;
        }
        .box {
          fill: #0f172a;
          stroke: #cbd5e1;
        }
        .box-muted, .chip {
          fill: #111827;
          stroke: #94a3b8;
        }
        .edge {
          stroke: #cbd5e1;
        }
        .edge-soft {
          stroke: #94a3b8;
        }
        .feedback {
          stroke: #f59e0b;
        }
        .accent {
          fill: #f59e0b;
        }
        .arrow-fill {
          fill: #cbd5e1;
        }
        .feedback-fill {
          fill: #f59e0b;
        }
      }
    </style>
  </defs>

  <rect class="canvas" width="1000" height="1080"/>

  <text x="96" y="58" class="title">Continuous Specification Improvement Loop</text>
  <text x="96" y="88" class="subtitle">Runtime iteration model for agent behavior, execution boundaries, evaluation signals, and specification updates.</text>

  <g transform="translate(300 128)">
    <rect class="box" x="0" y="0" width="520" height="96" rx="6"/>
    <text class="stage" x="24" y="30">01 / INPUTS</text>
    <text class="heading" x="24" y="62">Operational corpus</text>
    <text class="body" x="250" y="55">documents, policies, APIs, files</text>
    <text class="body" x="250" y="79">telemetry, run data</text>
  </g>

  <g transform="translate(300 268)">
    <rect class="box" x="0" y="0" width="520" height="106" rx="6"/>
    <text class="stage" x="24" y="31">02 / COMPILE</text>
    <text class="mono" x="24" y="66">SPECIFICATION.md</text>
    <text class="body" x="250" y="57">canonical rules, scope</text>
    <text class="body" x="250" y="82">success criteria, constraints</text>
  </g>

  <g transform="translate(300 418)">
    <rect class="box" x="0" y="0" width="520" height="118" rx="6"/>
    <text class="stage" x="24" y="31">03 / CONFIGURE</text>
    <text class="heading" x="24" y="66">Agentic runtime</text>
    <text class="body" x="250" y="54">specialists, handoffs, tools</text>
    <text class="body" x="250" y="78">skills, memory, retrieval</text>
    <text class="body" x="250" y="102">context strategy, boundaries</text>
  </g>

  <g transform="translate(300 580)">
    <rect class="box" x="0" y="0" width="520" height="106" rx="6"/>
    <text class="stage" x="24" y="31">04 / EXECUTE</text>
    <text class="heading" x="24" y="66">Sandbox runs</text>
    <text class="body" x="250" y="57">self-tests, assertions</text>
    <text class="body" x="250" y="82">success-criteria checks</text>
  </g>

  <g transform="translate(300 730)">
    <rect class="box" x="0" y="0" width="520" height="106" rx="6"/>
    <text class="stage" x="24" y="31">05 / EVALUATE</text>
    <text class="heading" x="24" y="66">Trajectory analysis</text>
    <text class="body" x="250" y="57">quality, accuracy, latency</text>
    <text class="body" x="250" y="82">token use, failure modes</text>
  </g>

  <g transform="translate(300 880)">
    <rect class="box-muted" x="0" y="0" width="520" height="118" rx="6"/>
    <text class="stage" x="24" y="31">06 / PROPOSE + AGGREGATE</text>
    <text class="heading" x="24" y="66">Specification update batch</text>
    <text class="small" x="24" y="89">spec_delta := observations + evidence + acceptance_check</text>
    <text class="small" x="24" y="110">merge(policy_updates, runtime_rules, eval_thresholds)</text>
  </g>

  <path class="edge" d="M560 224 V268"/>
  <path class="edge" d="M560 374 V418"/>
  <path class="edge" d="M560 536 V580"/>
  <path class="edge" d="M560 686 V730"/>
  <path class="edge" d="M560 836 V880"/>

  <path class="feedback" d="M300 939 H170 V321 H300"/>
  <rect class="chip" x="78" y="609" width="184" height="34" rx="17"/>
  <text class="chip-text" x="104" y="631">repeat on next run</text>

  <g transform="translate(96 1028)">
    <circle class="accent" cx="6" cy="-5" r="4"/>
    <text class="small" x="20" y="0">Invariant: every accepted proposal updates SPECIFICATION.md and adds or revises a validation check.</text>
  </g>
</svg>
