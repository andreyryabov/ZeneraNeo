ZF2F6GWE9","kind":"file","text":"TypeScript types and params for POST /policy/api/v1/infra/realized-state/virtual-machines/{virtual-machine-id}/tags (ApplyTagOnVirtualMachine) in nsx_policy_api_42.","audience":["*"],"createdAt":"2026-09-08T18:07:30.195Z","updatedAt":"2026-09-08T18:07:30.195Z","lastUsedAt":"2026-09-08T18:09:29.003Z","useCount":1,"revision":1,"file":{"path":"/memory/01M2137YAD0M58SJKZF2F6GWE9.txt","bytes":1876,"sha256":"933e12e0507c49f1cd9bc03f0b662247c01d9db39ec52142b046dded8bda8420","format":"txt"},"stale":false,"degree":1,"content":"// POST /policy/api/v1/infra/realized-state/virtual-machines/{virtual-machine-id}/tags  — Apply tags on virtual machine\nexport interface ApplyTagOnVirtualMachineParams {\n    /** query — Opaque cursor to be used for getting next page of records (supplied by current result page) */\n    cursor?: string;\n    /** query — The path of the enforcement point from which the list of members needs to be fetched. Forward slashes must be escaped using %2F. */\n    enforcement_point_path?: string;\n    /** query — If true, resources that are marked for deletion will be included in the results. By default, these resources are not included. */\n    include_mark_for_delete_objects?: boolean;\n    /** query — Maximum number of results to return in this page (server may return fewer) */\n    page_size?: number;\n    /** query — If true, results are sorted in ascending order */\n    sort_ascending?: boolean;\n    /** query — Field by which records are sorted */\n    sort_by?: string;\n    /** path */\n    'virtual-machine-id': string;\n}\n\n/** List of tags applied to the virtual machine. Based on the enforcement point, the virtual_machine_id will be different. It could be an external id for NSX T or a moid for NSX V */\nexport interface VirtualMachineTagsUpdate {\n    /** List of tags to be applied on the virtual machine */\n    tags: nsx_policy_api_42_Tag[];\n    /** The identifier that is used in the enforcement point that uniquely identifies the virtual machine. In case of NSXT it would be the value of the external_id of the virtual machine. */\n    virtual_machine_id?: string;\n}\n\n/** Arbitrary key-value pairs that may be attached to an entity */\nexport interface nsx_policy_api_42_Tag {\n    /** Tag searches may optionally be restricted by scope */\n    scope?: string;\n    /** Identifier meaningful to user with maximum length of 256 characters */\n    tag?: string;\n}\n\n"},{"id":"01M2137YAD7ZS08Y06T6BGF361","kind":"file","text":"TypeScript types and params for POST /api/v1/fabric/virtual-machines?action=update_tags (UpdateVirtualMachineTags) in nsx_manager_api_42.","audience":["*"],"createdAt":"2026-09-08T18:07:30.195Z","updatedAt":"2026-09-08T18:07:30.195Z","lastUsedAt":"2026-09-08T18:09:29.003Z","useCount":1,"revision":1,"file":{"path":"/memory/01M2137YAD7ZS08Y06T6BGF361.txt","bytes":662,"sha256":"bf3bb3c2cff9030c39d4317ca7d00085add9b7724731205f88d087efce07ce2a","format":"txt"},"stale":false,"degree":1,"content":"// POST /api/v1/fabric/virtual-machines?action=update_tags  — Perform action on specified virtual machine e.g. update tags\nexport interface VirtualMachineTagUpdate {\n    /** External id of the virtual machine to which tags are to be applied */\n    external_id: string;\n    /** List of tags to be applied to the virtual machine */\n    tags: nsx_manager_api_42_Tag[];\n}\n\n/** Arbitrary key-value pairs that may be attached to an entity */\nexport interface nsx_manager_api_42_Tag {\n    /** Tag searches may optionally be restricted by scope */\n    scope?: string;\n    /** Identifier meaningful to user with maximum length of 256 characters */\n    tag?: string;\n}\n\n"},{"id":"01M21392BW0H724BCCWRNMYYN8","kind":"fact","text":"According to NSX/vDefend 4.2 and 9.1 documentation, VMs flagged for security action can be quarantined and isolated using a combination of security tags, dynamic group membership, and Distributed Firewall (DFW) policies in the Emergency category.\n1. Infected/compromised VMs are identified and dynamically tagged using tags like 'virus_found=true' or 'quarantine' via APIs.\n2. A pre-defined dynamic Security Group is created with membership criteria based on the tag (e.g., VM Tag Equals 'quarantine' or 'virus_found=true'). This group automatically includes any VM as soon as the tag is applied.\n3. A Distributed Firewall (DFW) policy containing Block/Drop rules is created in the 'Emergency' category (which is recommended for quarantine and allow rules, and takes precedence over lower categories) and applied to the quarantine Security Group, isolating the VMs instantly.","audience":["*"],"createdAt":"2026-09-08T18:08:06.924Z","updatedAt":"2026-09-08T18:08:06.924Z","lastUsedAt":"2026-09-08T18:09:29.003Z","useCount":1,"revision":1,"stale":false,"degree":1},{"id":"01M21392BWZDDV7GDAFW0CHSCM","kind":"file","text":"Product documentation passages for VM isolation, security tagging, and quarantine in NSX 4.2 and 9.1.","audience":["*"],"createdAt":"2026-09-08T18:08:06.924Z","updatedAt":"2026-09-08T18:08:06.924Z","lastUsedAt":"2026-09-08T18:09:29.003Z","useCount":1,"revision":1,"file":{"path":"/memory/01M21392BWZDDV7GDAFW0CHSCM.txt","bytes":1319,"sha256":"0c6250ea5eaf0d0c13184d618d287bd00d45a21c830d2b35ebb7f0f7479e8595","format":"txt"},"stale":false,"degree":1,"content":"From reference-nsx-vdefend-firewall-atp-4.2.x-docs/quarantine-vms.html.md:\n\"After rules are applied to VM groups, based on the protection level and tag set by partners, there might be VMs that are identified as infected that need to be quarantined.\nPartners use the API with tag virus_found=true to tag VMs that are infected.\nAffected VMs are attached with the virus_found=true tag.\nAs an administrator, you can create a pre-defined quarantine group based on tag with virus_found=true value, such that the group gets populated with infected VMs as and when they are tagged.\nAs an admin, you might choose to set specific firewall rules for the quarantine group.\nYou can set firewall rules for the quarantine group.\nFor example, you might choose to block all traffic incoming and outgoing from the quarantine group.\"\n\nFrom reference-nsx-vdefend-firewall-atp-9.1.x-docs/add-a-group.html.md:\n\"Tags in NSX are case-sensitive, but a group that is based on tags is \"case-insensitive.\" For example, if the dynamic grouping membership criterion is VM Tag Equals 'quarantine', the group includes all VMs that contain either the tags 'quarantine' or 'QUARANTINE'.\"\n\nFrom reference-nsx-vdefend-firewall-atp-9.1.x-docs/distributed-firewall.html.md:\n\"Emergency\nWe recommend you include quarantine and allow rules for this category.\"\n"},{"id":"01M2139VP88MRPQ48TWCS30C3Y","kind":"fact","text":"Dynamic identification and isolation of VMs flagged by high-priority system alerts in NSX/vDefend 4.2.x/9.1.x:\n1. Identify high-priority open system alarms via GET /api/v1/alarms?severity=CRITICAL,HIGH\u0026status=OPEN (AlarmsListResult holds Alarm list. VM identifier is extracted from entity_id where entity_resource_type == 'VirtualMachine').\n2. Alternatively, retrieve IDS/IPS security events and affected VMs using /policy/api/v1/infra/settings/firewall/security/intrusion-services/affected-vms.\n3. Attach security tags without overwriting existing tags using POST /api/v1/fabric/virtual-machines?action=add_tags (VirtualMachineTagUpdate payload). Overwriting is possible with realized-state POST /policy/api/v1/infra/realized-state/virtual-machines/{vm-id}/tags.\n4. Establish dynamic security grouping (e.g. VM Tag Equals 'quarantine', case-insensitive evaluation) and assign to an Emergency Category Distributed Firewall (DFW) policy to drop all traffic.","audience":["*"],"createdAt":"2026-09-08T18:08:32.560Z","updatedAt":"2026-09-08T18:08:32.560Z","lastUsedAt":"2026-09-08T18:09:29.003Z","useCount":1,"revision":1,"stale":false,"degree":2},{"id":"01M213EK28P32MRSQ169JHF198","kind":"task","text":"Scan the DFW rules and return a risk report of any rules with ANY in source or destinations that allow medium and high-risk ports, and list impacted VMs","audience":["*"],"createdAt":"2026-09-08T18:11:08.136Z","updatedAt":"2026-09-08T18:23:47.655Z","lastUsedAt":"2026-09-08T18:18:22.216Z","useCount":1,"revision":2,"stale":false,"degree":10},{"id":"01M213EK2845C0K8QDV270Y839","kind":"plan","text":"Part 1: Fork to docs_searcher to check for any standard product guidelines on DFW risk reports or medium/high-risk ports. Part 2: Fork to api_doc_searcher to find DFW policy/rule retrieval and Group-to-VM member resolution APIs. Then run Code Runner with the gathered information to scan and generate the report.","audience":["*"],"createdAt":"2026-09-08T18:11:08.136Z","updatedAt":"2026-09-08T18:11:08.136Z","lastUsedAt":"2026-09-08T18:18:22.216Z","useCount":1,"revision":1,"stale":true,"degree":2},{"id":"01M213H74CTC83YYQ30GX8WRWZ","kind":"fact","text":"There is no official or standard definition of 'high-risk ports' or 'medium-risk ports' in the NSX or vDefend product documentation (v4.2/v9.1). However, the vDefend Security Services Platform (SSP) Firewall Rule Analysis feature identifies 'Permissiveness' (allowing ALL traffic from ANY source to ANY destination using ANY service) as a High Priority anomaly that should be fixed immediately.","audience":["*"],"createdAt":"2026-09-08T18:12:34.098Z","updatedAt":"2026-09-08T18:12:34.098Z","lastUsedAt":"2026-09-08T18:43:11.530Z","useCount":5,"revision":1,"stale":false,"degree":1},{"id":"01M213H74CRJH6GKSW077RHPSE","kind":"file","text":"Excerpts from VMware vDefend Design Library deployment guides detailing the Firewall Rule Analysis SSP feature and DFW rule anomaly definitions.","audience":["*"],"createdAt":"2026-09-08T18:12:34.098Z","updatedAt":"2026-09-08T18:12:34.098Z","lastUsedAt":"2026-09-08T18:43:11.530Z","useCount":5,"revision":1,"file":{"path":"/memory/01M213H74CRJH6GKSW077RHPSE.txt","bytes":3864,"sha256":"b606f695962379b93d585aa78da63554c5ac19e98d19bf64152b9bda056683d2","format":"txt"},"stale":false,"degree":1,"content":"24 | # [Firewall Rule Analysis](https://techdocs.broadcom.com/us/en/vmware-security-load-balancing/vdefend/design-library-for-vdefend/index/vdefend-firewall-for-small-deployments/dfw-with-ssp-and-security-intelligence/firewall-rule-analysis.html#GUID-23f4353c-6b2f-480c-9d4e-e401e63c6481-en_id-ec993d34-6fae-4320-feb7-8560a4d7be78)\n25 | \n26 | This section is optional and not required to secure the Infrastructure Services or the VCF Management Domain.\n27 | Firewall Rule Analysis is a Security Services Platform feature that automatically analyzes the vDefend DFW policy for contradictions, redundancies, and inefficiencies.\n28 | It is an essential tool for ongoing policy hygiene as your DFW ruleset grows through Security Journey automation and manual additions.\n29 | \n30 | 1. Login in SSP - Log in to the SSP with Enterprise Administrator credentials.\n31 | 2. Find Card - Navigate to System \u003e Platform \u0026 Features.\n32 |     Locate the Rule Analysis feature card and click Activate.\n33 | 3. Pre-Checks - Click Run Pre-checks to validate prerequisites (license, version, platform health).\n34 |     All pre-checks must pass.\n35 | 4. Activate - Click Activate to complete.\n36 |     Wait for the feature status to change to UP (typically 5–15 minutes).\n37 | 5. Set Schedule - Configure a recurring analysis schedule (weekly, monthly, or quarterly) for continuous policy hygiene.\n38 |     \n39 | Rule Analysis examines rules across a 6-tuple of parameters: Source, Destination, Applied To, Services, Context Profiles, and Direction.\n40 | It detects seven distinct anomaly types:\n41 | \n42 | | # | Anomaly Type | Priority | Definition | Resolution |\n43 | | --- |---|---|---|---|\n44 | | 1 | Contradiction | High — Fix Immediately | Two or more rules have identical configuration but different actions (e.g., one allows, one denies). The higher-priority rule always wins, creating confusion and potential security violations. | Determine the correct security posture. Delete the incorrect rule or modify rules to be more specific. |\n45 | | 2 | Shadowing | High — Fix Immediately | A higher-priority rule completely encompasses a lower-priority rule with a different action, preventing the lower rule from ever being evaluated. Can cause application outages. | Adjust rule order (move the specific allow rule before the broad deny rule) or modify the broad rule to be more specific. |\n46 | | 3 | Permissiveness | High — Fix Immediately (production) | A rule that allows ALL traffic from ANY source to ANY destination using ANY service, violating the principle of least privilege. | Replace the overly permissive rule with specific rules that explicitly name sources, destinations, and services. |\n47 | | 4 | Redundancy | Medium — Fix Within Sprint | A higher-priority rule completely encompasses a lower-priority rule with the same action, making the lower rule unreachable. Wastes rule capacity. | Delete the lower-priority redundant rule. |\n48 | | 5 | Irrelevance | Medium — Fix Within Sprint | A rule references resources that do not exist or cannot be applied — such as an empty group, or an IP-set-based group in the Applied-To field of a DFW rule. | For empty groups: delete the rule or fix group membership. For IP-set Applied-To: update the field to reference appropriate VM groups or segments. |\n49 | | 6 | Duplication | Low — Fix During Maintenance | Two or more rules have identical configuration and the same action. Wastes processing resources and creates maintenance overhead. | Delete one of the duplicate rules. |\n50 | | 7 | Consolidation | Low — Fix During Maintenance | Two or more rules share the same source, destination, Applied-To, and action but differ only in services or context profiles. These can be merged. | Create a single consolidated rule combining all services or context profiles, then delete the original rules. |\n51 | \n"},{"id":"01M213JN195G5BETFW7GK9FGAT","kind":"fact","text":"Identified NSX Policy API v4.2/9.1 endpoints for listing security policies, services, and resolving group membership: GET /policy/api/v1/infra/domains/default/security-policies, GET /policy/api/v1/infra/services, and GET /policy/api/v1/infra/domains/default/groups/{group-id}/members/virtual-machines. ServiceEntry types include L4PortSetServiceEntry and IPProtocolServiceEntry.","audience":["*"],"createdAt":"2026-09-08T18:13:21.205Z","updatedAt":"2026-09-08T18:13:21.205Z","lastUsedAt":"2026-09-08T18:43:11.530Z","useCount":7,"revision":1,"stale":false,"degree":1},{"id":"01M213JN19PJS005WNDMX3RXH4","kind":"file","text":"TypeScript type for Service in nsx_policy_api_42","audience":["*"],"createdAt":"2026-09-08T18:13:21.205Z","updatedAt":"2026-09-08T18:13:21.205Z","lastUsedAt":"2026-09-08T18:33:42.120Z","useCount":7,"revision":1,"file":{"path":"/memory/01M213JN19PJS005WNDMX3RXH4.txt","bytes":3542,"sha256":"0230f55ebffde1e5f36481c218cc0f68e87d0f324e5d3d65dc3bd8ecda3d94fa","format":"txt"},"stale":false,"degree":1,"content":"/** Grouping of one or more service entries that describes a network traffic type (e.g. L4 port, IP protocol, ICMP type, EtherType). Referenced by firewall rules via the `services` field. Traffic matches… */\nexport type Service = nsx_policy_api_42_PolicyConfigResource \u0026 { is_default?: boolean; service_entries?: ServiceEntry[]; service_type?: string };\n\n/** Base type for a service entry. Each concrete subtype is identified by its `resource_type` field. Check `resource_type` before accessing subtype-specific fields */\nexport type ServiceEntry = nsx_policy_api_42_PolicyConfigResource \u0026 { resource_type: 'IPProtocolServiceEntry' | 'IGMPTypeServiceEntry' | 'ICMPTypeServiceEntry' | 'ALGTypeServiceEntry' | 'L4PortSetServiceEntry' | 'EtherTypeServiceEntry' | 'NestedServiceServiceEntry' };\n\n/** Represents an object on the desired state */\nexport type nsx_policy_api_42_ChildPolicyConfigResource = nsx_policy_api_42_ManagedResource \u0026 { mark_for_override?: bo ityPolicyListResult  (output)  [source: nsx_policy_api_42] — Paged Collection of security policies\n\n=== TYPES ===\n// GET /policy/api/v1/infra/domains/{domain-id}/security-policies  — List distributed firewall security policies\n/** Allows more granular policies for application workloads */\nexport interface ApplicationConnectivityStrategy {\n    /** App connectivity strategies */\n    application_connectivity_strategy: 'ALLOW_INTRA' | 'ALLOW_EGRESS' | 'ALLOW_INGRESS' | 'DROP_INGRESS' | 'DROP_EGRESS';\n    /** Based on the value of the app connectivity strategy, a default rule is created for the security policy. The rule id is internally assigned by the system for this default rule. */\n    default_application_rule_id?: number;\n    /** Flag to enable packet logging. Default is deactivated. */\n    logging_enabled?: boolean;\n}\n\n/** A rule indicates the action to be performed for various types of traffic flowing between workload groups. */\nexport type BaseRule = nsx_policy_api_42_PolicyConfigResource \u0026 { destination_groups?: string[]; destinations_excluded?: boolean; direction?: 'IN' | 'OUT' | 'IN_OUT'; disabled?: boolean; ip_protocol?: 'IPV4' | 'IPV6' | 'IPV4_IPV6'; is_default?: boolean; logged?: boolean; notes?: string; profiles?: string[]; rule_id?: number; scope?: string[]; sequence_number?: number; service_entries?: ServiceEntry[]; services?: string[]; source_groups?: string[]; sources_excluded?: boolean; tag?: string };\n\n/** Ordered list of Rules. This object is created by default along with the Domain. */\nexport type Policy = nsx_policy_api_42_PolicyConfigResource \u0026 { category?: string; comments?: string; internal_sequence_number?: number; is_default?: boolean; lock_modified_by?: string; lock_modified_time?: number; locked?: boolean; rule_count?: number; scheduler_path?: string; scope?: string[]; sequence_number?: number; stateful?: boolean; tcp_strict?: boolean };\n\n/** Paged Collection of security policies */\nexport type PolicyListResult = nsx_policy_api_42_ListResult \u0026 Record\u003cstring, unknown\u003e;\n\n/** A rule indicates the action to be performed for various types of traffic flowing between workload groups. */\nexport type Rule = BaseRule \u0026 { action?: 'ALLOW' | 'DROP' | 'REJECT' | 'JUMP_TO_APPLICATION'; osi_layer?: 'L2' | 'L3' | 'L4' | 'L7' };\n\n/** Distributed Firewall (DFW) Security Policy containing an ordered list of Rules for east-west traffic control between workloads. */\nexport type SecurityPolicy = Policy \u0026 { application_connectivity_strategy?: ApplicationConnectivityStrategy[]; category?: 'Ethernet' | 'Emergency' | 'Infrastructure' | 'Environment' | 'Application'; connectivity_preference?: 'ALLOWLIST' | 'DENYLIST' | 'ALLOWLIST_ENABLE_LOGGING' | 'DENYLIST_ENABLE_LOGGING' | 'NONE'; default_rule_id?: number; rules?: Rule[] };\n\n/** Paged Collection of security policies */\nexport type SecurityPolicyListResult = PolicyListResult \u0026 { results: SecurityPolicy[] };\n\n/** Base type for a service entry. Each concrete subtype is identified by its `resource_type` field. Check `resource_type` before accessing subtype-specific fields */\nexport type ServiceEntry = nsx_policy_api_42_PolicyConfigResource \u0026 { resource_type: 'IPProtocolServiceEntry' | 'IGMPTypeServiceEntry' | 'ICMPTypeServiceEntry' | 'ALGTypeServiceEntry' | 'L4PortSetServiceEntry' | 'EtherTypeServiceEntry' | 'NestedServiceServiceEntry' };\n\n/** Represents an object on the desired state */\nexport type nsx_policy_api_42_ChildPolicyConfigResource = nsx_policy_api_42_ManagedResource \u0026 { mark_for_override?: boolean; marked_for_delete?: boolean; request_parameter?: nsx_policy_api_42_PolicyRequestParameter; resource_type: string };\n\n/** Base class for list results from collections */\nexport type nsx_policy_api_42_ListResult = nsx_policy_api_42_Resource \u0026 { cursor?: string; result_count?: number; sort_ascending?: boolean; sort_by?: string };\n\n/** Base type for resources that are managed by API clients */\nexport type nsx_policy_api_42_ManagedResource = nsx_policy_api_42_RevisionedResource \u0026 { _create_time?: number; _create_user?: string; _last_modified_time?: number; _last_modified_user?: string; _protection?: string; _system_owned?: boolean; description?: string; display_name?: string; id?: string; resource_type?: string; tags?: nsx_policy_api_42_Tag[] };\n\n/** Represents an object on the desired state. */\nexport type nsx_policy_api_42_PolicyConfigResource = nsx_policy_api_42_PolicyResource \u0026 { children?: nsx_policy_api_42_ChildPolicyConfigResource[]; marked_for_delete?: boolean; overridden?: boolean };\n\n/** Optional API Request Parameter to be used in HAPI. */\nexport interface nsx_policy_api_42_PolicyRequestParameter {\n    /** The type of this request parameter. */\n    resource_type: string;\n}\n\n/** Abstract base class for all the policy objects. */\nexport type nsx_policy_api_42_PolicyResource = nsx_policy_api_42_ManagedResource \u0026 { origin_site_id?: string; owner_id?: string; parent_path?: string; path?: string; realization_id?: string; relative_path?: string; remote_path?: string; unique_id?: string };\n\n/** Base class for resources */\nexport interface nsx_policy_api_42_Resource {\n    /** The server will populate this field when returing the resource. Ignored on PUT and POST. */\n    _links?: nsx_policy_api_42_ResourceLink[];\n    /** Schema for this resource */\n    _schema?: string;\n    _self?: nsx_policy_api_42_SelfResourceLink;\n}\n\n/** A link to a related resource */\nexport interface nsx_policy_api_42_ResourceLink {\n    /** Optional action */\n    action?: string;\n    /** Link to resource */\n    href?: string;\n    /** Custom relation type (follows RFC 5988 where appropriate definitions exist) */\n    rel?: string;\n}\n\n/** A base class for types that track revisions */\nexport type nsx_policy_api_42_RevisionedResource = nsx_policy_api_42_Resource \u0026 { _revision?: number };\n\n/** The server will populate this field when returing the resource. Ignored on PUT and POST. */\nexport type nsx_policy_api_42_SelfResourceLink = nsx_policy_api_42_ResourceLink \u0026 Record\u003cstring, unknown\u003e;\n\n/** Arbitrary key-value pairs that may be attached to an entity */\nexport interface nsx_policy_api_42_Tag {\n    /** Tag searches may optionally be restricted by scope */\n    scope?: string;\n    /** Identifier meaningful to user with maximum length of 256 characters */\n    tag?: string;\n}\n\n"},{"id":"01M214632MAW54NSXP32GDP57Q","kind":"plan","text":"Round 3 Plan: Transfer to code_runner to run a script that scans DFW rules from GET /policy/api/v1/infra/domains/default/security-policies, resolves services, filters for ANY source/destination rules allowing medium/high-risk ports, and resolves impacted VMs via GET /policy/api/v1/infra/domains/default/groups/{group-id}/members/virtual-machines.","audience":["*"],"createdAt":"2026-09-08T18:23:47.655Z","updatedAt":"2026-09-08T18:23:47.655Z","lastUsedAt":"2026-09-08T18:23:47.655Z","useCount":0,"revision":1,"stale":true,"degree":2},{"id":"01M214APBSJ0H94TS9PMG3EKHZ","kind":"plan","text":"Round 3 Plan: Route to code_runner to write and execute a Python script that scans all DFW policies, filters rules with ALLOW action and ANY in source or destination, resolves service entries against defined medium and high-risk ports, resolves group memberships to VMs, and formats the final risk report.","audience":["*"],"createdAt":"2026-09-08T18:26:29.058Z","updatedAt":"2026-09-08T18:26:29.058Z","lastUsedAt":"2026-09-08T18:33:42.120Z","useCount":1,"revision":1,"stale":false,"degree":3},{"id":"01M214APBSAGKPY6CYM1EMV2BF","kind":"file","text":"DFW Rules Risk Scan Plan detailing definition of high/medium-risk ports and step-by-step logic for policy, service, and VM resolution.","audience":["*"],"createdAt":"2026-09-08T18:26:29.058Z","updatedAt":"2026-09-08T18:26:29.058Z","lastUsedAt":"2026-09-08T18:43:11.530Z","useCount":2,"revision":1,"file":{"path":"/memory/01M214APBSAGKPY6CYM1EMV2BF.md","bytes":2094,"sha256":"f8b95c567b92893e78d9b1a5b3f4ee84c4487bca281132b4c44263842c46694c","format":"md"},"stale":false,"degree":1,"content":"# DFW Rules Risk Scan Plan\n\n## Context\nScan the DFW rules and return a risk report of any rules with ANY in source or destinations that allow medium and high-risk ports, and list impacted VMs.\n\n## Definition of Ports\n- **High-Risk Ports**:\n  - 21 (FTP)\n  - 22 (SSH)\n  - 23 (Telnet)\n  - 80 (HTTP)\n  - 135, 137, 139 (NetBIOS)\n  - 445 (SMB)\n  - 3389 (RDP)\n  - 5900, 5901 (VNC)\n  - Database ports: 1433, 1434 (MSSQL), 3306 (MySQL), 5432 (Postgres), 1521 (Oracle), 27017 (MongoDB), 6379 (Redis)\n  - 389 (LDAP)\n\n- **Medium-Risk Ports**:\n  - 25, 465, 587 (SMTP)\n  - 53 (DNS)\n  - 161, 162 (SNMP)\n  - 110, 995 (POP3)\n  - 143, 993 (IMAP)\n  - 636 (LDAPS)\n  - 123 (NTP)\n  - 8080, 8443 (HTTP-Alt)\n\n## Steps\n1. **Fetch DFW Policies and Rules**:\n   - Query `GET /policy/api/v1/infra/domains/default/security-policies`.\n   - For each policy, retrieve its rules.\n2. **Filter Rules**:\n   - Action must be `ALLOW`.\n   - `source_groups` contains `\"ANY\"` (or is empty) OR `destination_groups` contains `\"ANY\"` (or is empty).\n3. **Analyze Services \u0026 Ports**:\n   - If `services` contains `\"ANY\"` or is empty:\n     - Flag as **High Risk** (allows all ports, including all high and medium risk ports).\n   - If specific services are used:\n     - Fetch each service from `/policy/api/v1/infra/services/\u003cservice-id\u003e`.\n     - Extract destination ports from the service's `service_entries` (e.g., of type `L4PortSetServiceEntry`).\n     - Check if there is an overlap with high-risk or medium-risk ports.\n4. **Identify Impacted VMs**:\n   - For each flagged rule:\n     - Find the non-ANY groups in the rule (source or destination groups).\n     - If both are ANY or empty, find the `scope` groups (Applied To). If scope is ANY/empty, it applies to all VMs in the DFW environment.\n     - For each identified group, query `GET /policy/api/v1/infra/domains/default/groups/\u003cgroup-id\u003e/members/virtual-machines` to list the VM names and IDs.\n5. **Generate Risk Report**:\n   - Format the findings in a structured table or markdown format showing Rule ID/Name, Risk Level (High/Medium), Allowed Port/Service, Reason, and Impacted VMs.\n"},{"id":"01M214DB308MYPGZ3PWZQTHRQT","kind":"task","text":"Search for the API to retrieve virtual machine members of a group in the policy API. Specifically, check GET /policy/api/v1/infra/domains/default/groups/{group_id}/members/virtual-machines. What are the query parameters, path parameters, and the exact response schema? How are VM names and IDs returned?","audience":["*"],"createdAt":"2026-09-08T18:27:55.684Z","updatedAt":"2026-09-08T18:27:55.684Z","lastUsedAt":"2026-09-08T18:27:55.684Z","useCount":0,"revision":1,"stale":false,"degree":2},{"id":"01M214DB30XA106KYSNHQDVPYM","kind":"fact","text":"Endpoint GET /policy/api/v1/infra/domains/{domain-id}/groups/{group-id}/members/virtual-machines (Method:_GetGroupVMMembers) and response schema RealizedVirtualMachineListResult (Type:RealizedVirtualMachineListResult) are defined in NSX Policy API 4.2 (nsx_policy_api_42).","audience":["*"],"createdAt":"2026-09-08T18:27:55.684Z","updatedAt":"2026-09-08T18:27:55.684Z","lastUsedAt":"2026-09-08T18:45:17.782Z","useCount":1,"revision":1,"stale":false,"degree":1},{"id":"01M214DB30M8TH9DDC9SRGRAK5","kind":"file","text":"OpenAPI spec detail of Method:_GetGroupVMMembers and related schemas including RealizedVirtualMachineListResult","audience":["*"],"createdAt":"2026-09-08T18:27:55.684Z","updatedAt":"2026-09-08T18:27:55.684Z","lastUsedAt":"2026-09-08T18:45:17.782Z","useCount":3,"revision":1,"file":{"path":"/memory/01M214DB30M8TH9DDC9SRGRAK5.txt","bytes":36403,"sha256":"d154a2d0bb929fa173b86eef99334534a021f556e090acf8192ae8e5f8c53402","format":"txt"},"stale":false,"degree":1,"content":"{\n  \"openapi\": \"3.1.0\",\n  \"info\": {\n vision of the resource. To prevent clients from overwriting each other's changes, PUT operations must include the current _revision of the resource, which clients should obtain by issuing a GET operation. If the _revision provided in a PUT request is missing or stale, the operation will be rejected.\",\n                \"format\": \"int32\",\n                \"title\": \"Generation of this resource config\",\n                \"type\": \"integer\",\n                \"x-vmw-nsx-computed\": true\n              }\n            },\n            \"type\": \"object\",\n            \"x-vmw-nsx-module\": \"Common\"\n          }\n        ],\n        \"description\": \"A base class for types that track revisions\",\n        \"title\": \"A base class for types that track revisions\",\n        \"x-vmw-nsx-module\": \"Common\"\n      },\n      \"nsx_policy_api_42.SelfResourceLink\": {\n        \"allOf\": [\n          {\n            \"$ref\": \"#/components/schemas/nsx_policy_api_42.ResourceLink\"\n          },\n          {\n            \"type\": \"object\",\n            \"x-vmw-nsx-module\": \"Common\"\n          }\n        ],\n        \"description\": \"The server will populate this field when returing the resource. Ignored on PUT and POST.\",\n        \"title\": \"Link to this resource\",\n        \"x-vmw-nsx-module\": \"Common\"\n      },\n      \"nsx_policy_api_42.Tag\": {\n        \"description\": \"Arbitrary key-value pairs that may be attached to an entity\",\n        \"properties\": {\n          \"scope\": {\n            \"default\": \"\",\n            \"description\": \"Tag searches may optionally be restricted by scope\",\n            \"maxLength\": 128,\n            \"readOnly\": false,\n            \"title\": \"Tag scope\",\n            \"type\": \"string\"\n          },\n          \"tag\": {\n            \"default\": \"\",\n            \"description\": \"Identifier meaningful to user with maximum length of 256 characters\",\n            \"readOnly\": false,\n            \"title\": \"Tag value\",\n            \"type\": \"string\"\n          }\n        },\n        \"title\": \"Arbitrary key-value pairs that may be attached to an entity\",\n        \"type\": \"object\",\n        \"x-vmw-nsx-module\": \"Common\"\n      }\n    }\n  }\n}\n"},{"id":"01M214FZXA945TX4ATY278HHVG","kind":"task","text":"Search for the policy security policies API. Specifically, check the GET /policy/api/v1/infra/domains/default/security-policies endpoint. Does it return nested rules, or do we need to pass a query parameter like 'include_rules=true'? What is the response type and field structure for SecurityPolicy and Rule (specifically action, source_groups, destination_groups, services, and scope/applied_to)?","audience":["*"],"createdAt":"2026-09-08T18:29:22.527Z","updatedAt":"2026-09-08T18:29:22.527Z","lastUsedAt":"2026-09-08T18:29:22.527Z","useCount":0,"revision":1,"stale":false,"degree":2},{"id":"01M214FZXABY969FNW3SW0Y0N4","kind":"fact","text":"The GET /policy/api/v1/infra/domains/{domain-id}/security-policies endpoint returns nested rules inside the SecurityPolicy objects by default under the 'rules' field, without requiring any query parameters like 'include_rules=true'. The parameter representing Applied To in the API is 'scope' (there is no 'applied_to' field). Under nsx_policy_api_42.","audience":["*"],"createdAt":"2026-09-08T18:29:22.527Z","updatedAt":"2026-09-08T18:29:22.527Z","lastUsedAt":"2026-09-08T18:29:22.527Z","useCount":0,"revision":1,"stale":false,"degree":1},{"id":"01M214FZXAKYFGTZJWHDE3MQR3","kind":"file","text":"OpenAPI specifications and schema details of SecurityPolicy and Rule (including BaseRule) from nsx_policy_api_42.","audience":["*"],"createdAt":"2026-09-08T18:29:22.527Z","updatedAt":"2026-09-08T18:29:22.527Z","lastUsedAt":"2026-09-08T18:43:42.429Z","useCount":2,"revision":1,"file":{"path":"/memory/01M214FZXAKYFGTZJWHDE3MQR3.txt","bytes":100013,"sha256":"9f43805f22622a04b02f9227a9cd6791dd25a708c06bd7cc739a5a9987424b8b","format":"txt"},"stale":false,"degree":1,"content":"{\n  \"openapi\": \"3.1.0\",\n  \"info\": {\n    \"title\": \"Selection\",\n    \"version\": \"0\"\n  },\n  \"paths\": {\n    \"/policy/api/v1/infra/domains/{domain-id}/security-policies/{security-policy-id}\": {\n      \"get\": {\n        \"operationId\": \"_ReadSecurityPolicyForDomain\",\n        \"summary\": \"Read a distributed firewall security policy\",\n        \"description\": \"Read a distributed firewall (DFW) security policy for a domain.\",\n        \"parameters\": [\n          {\n            \"name\": \"domain-id\",\n            \"in\": \"path\",\n            \"required\": true,\n            \"schema\": {\n              \"type\": \"string\"\n            }\n          },\n          {\n            \"name\": \"security-policy-id\",\n            \"in\": \"path\",\n            \"required\": true,\n            \"schema\": {\n              \"type\": \"string\"\n            }\n          }\n        ],\n        \"responses\": {\n          \"200\": {\n            \"description\": \"OK\",\n            \"content\": {\n              \"application/json\": {\n                \"schema\": {\n                  \"$ref\": \"#/components/schemas/SecurityPolicy\"\n                }\n              }\n            }\n          }\n        }\n      }\n    },\n    \"/policy/api/v1/infra/domains/{domain-id}/security-policies/{security-policy-id}/rules\": {\n      \"get\": {\n        \"operationId\": \"ListSecurityRules\",\n        \"summary\": \"List distributed firewall rules in a security policy\",\n        \"description\": \"Returns a paginated list of all distributed firewall rules within a specific security\\npolicy.\",\n        \"parameters\": [\n          {\n            \"name\": \"domain-id\",\n            \"in\": \"path\",\n            \"required\": true,\n            \"schema\": {\n              \"type\": \"string\"\n            }\n          },\n          {\n            \"name\": \"security-policy-id\",\n            \"in\": \"path\",\n            \"required\": true,\n            \"schema\": {\n              \"type\": \"string\"\n            }\n          },\n          {\n            \"name\": \"cursor\",\n            \"in\": \"query\",\n            \"required\": false,\n            \"description\": \"Opaque cursor to be used for getting next page of records (supplied by current result page)\",\n            \"schema\": {\n              \"type\": \"string\"\n            }\n          },\n          {\n            \"name\": \"include_mark_for_delete_objects\",\n            \"in\": \"query\",\n            \"required\": false,\n            \"description\": \"If true, resources that are marked for deletion will be included\\nin the results. By default, these resources are not included.\",\n            \"schema\": {\n              \"default\": false,\n              \"type\": \"boolean\"\n            }\n          },\n          {\n            \"name\": \"page_size\",\n            \"in\": \"query\",\n            \"required\": false,\n            \"description\": \"Maximum number of results to return in this page (server may return fewer)\",\n            \"schema\": {\n              \"default\": 1000,\n              \"format\": \"int64\",\n              \"maximum\": 1000,\n              \"minimum\": 0,\n              \"type\": \"integer\"\n            }\n          },\n          {\n            \"name\": \"sort_ascending\",\n            \"in\": \"query\",\n            \"required\": false,\n            \"description\": \"If true, results are sorted in ascending order\",\n            \"schema\": {\n              \"type\": \"boolean\"\n            }\n          },\n          {\n            \"name\": \"sort_by\",\n            \"in\": \"query\",\n            \"required\": false,\n            \"description\": \"Field by which records are sorted\",\n            \"schema\": {\n              \"type\": \"string\"\n            }\n          }\n        ],\n        \"responses\": {\n          \"200\": {\n            \"description\": \"OK\",\n            \"content\": {\n              \"application/json\": {\n                \"schema\": {\n                  \"$ref\": \"#/components/schemas/RuleListResult\"\n                }\n              }\n            }\n          }\n        }\n      }\n    },\n    \"/policy/api/v1/infra/domains/{domain-id}/security-policies/{security-policy-id}/rules/{rule-id}\": {\n      \"get\": {\n        \"operationId\": \"ReadSecurityRule\",\n        \"summary\": \"Read a distributed firewall rule by ID\",\n        \"description\": \"Returns the configuration of a specific distributed firewall rule within a security\\npolicy.\",\n        \"parameters\": [\n          {\n            \"name\": \"domain-id\",\n            \"in\": \"path\",\n            \"required\": true,\n            \"schema\": {\n              \"type\": \"string\"\n            }\n          },\n          {\n            \"name\": \"security-policy-id\",\n            \"in\": \"path\",\n            \"required\": true,\n            \"schema\": {\n              \"type\": \"string\"\n            }\n          },\n          {\n            \"name\": \"rule-id\",\n            \"in\": \"path\",\n            \"required\": true,\n            \"schema\": {\n              \"type\": \"string\"\n            }\n          }\n        ],\n        \"responses\": {\n          \"200\": {\n            \"description\": \"OK\",\n            \"content\": {\n              \"application/json\": {\n                \"schema\": {\n                  \"$ref\": \"#/components/schemas/Rule\"\n                }\n              }\n            }\n          }\n        }\n      }\n    }\n  },\n  \"components\": {\n    \"schemas\": {\n      \"ApplicationConnectivityStrategy\": {\n        \"description\": \"Allows more granular policies for application workloads\\n\",\n        \"properties\": {\n          \"application_connectivity_strategy\": {\n            \"description\": \"App connectivity strategies\\n\",\n            \"enum\": [\n              \"ALLOW_INTRA\",\n              \"ALLOW_EGRESS\",\n              \"ALLOW_INGRESS\",\n              \"DROP_INGRESS\",\n              \"DROP_EGRESS\"\n            ],\n            \"title\": \"Application connectivity strategy\",\n            \"type\": \"string\"\n          },\n          \"default_application_rule_id\": {\n            \"description\": \"Based on the value of the app connectivity strategy, a default rule is\\ncreated for the security policy. The rule id is internally assigned\\nby the system for this default rule.\\n\",\n            \"format\": \"int64\",\n            \"readOnly\": true,\n            \"title\": \"Default rule ID associated with the application_connectivity_strategy\",\n            \"type\": \"integer\"\n          },\n          \"logging_enabled\": {\n            \"default\": false,\n            \"description\": \"Flag to enable packet logging. Default is deactivated.\",\n            \"readOnly\": false,\n            \"title\": \"Enable logging flag\",\n            \"type\": \"boolean\"\n          }\n        },\n        \"required\": [\n          \"application_connectivity_strategy\"\n        ],\n        \"title\": \"Application specific connectivity strategy\",\n        \"type\": \"object\",\n        \"x-vmw-nsx-module\": \"Policy\"\n      },\n      \"BaseRule\": {\n        \"allOf\": [\n          {\n            \"$ref\": \"#/components/schemas/nsx_policy_api_42.PolicyConfigResource\"\n          },\n          {\n            \"properties\": {\n              \"destination_groups\": {\n                \"description\": \"Specifies the destinations to match for this rule. This field accepts Group paths\\n(e.g., \\\"/infra/domains/default/groups/db-vms\\\") or direct IP addresses.\\nGroup paths reference Group objects that define collections of workloads.\\nIP addresses can be specified in CIDR notation, as individual addresses, or as ranges.\\nUse the constant \\\"ANY\\\" to match all destinations. \\\"ANY\\\" is case-insensitive and must be\\nthe ONLY element in the array if used. An error will be thrown if \\\"ANY\\\" is used\\nin conjunction with other values.\\n\",\n                \"items\": {\n                  \"type\": \"string\"\n                },\n                \"maxItems\": 128,\n                \"title\": \"Destination group paths\",\n                \"type\": \"array\"\n              },\n              \"destinations_excluded\": {\n                \"default\": false,\n                \"description\": \"If set to true, the rule gets applied on all the groups that are\\nNOT part of the destination groups. If false, the rule applies to the\\ndestination groups\\n\",\n                \"readOnly\": false,\n                \"title\": \"Negation of destination groups\",\n                \"type\": \"boolean\"\n              },\n              \"direction\": {\n                \"default\": \"IN_OUT\",\n                \"description\": \"Specifies the direction of traffic to which this rule applies:\\n- IN: Applies to incoming traffic only (traffic coming into the workload)\\n- OUT: Applies to outgoing traffic only (traffic leaving the workload)\\n- IN_OUT: Applies to both incoming and outgoing traffic (default)\\n\",\n                \"enum\": [\n                  \"IN\",\n                  \"OUT\",\n                  \"IN_OUT\"\n                ],\n                \"title\": \"Direction\",\n                \"type\": \"string\"\n              },\n              \"disabled\": {\n                \"default\": false,\n                \"description\": \"Flag to deactivate the rule. Default is activated.\",\n                \"readOnly\": false,\n                \"title\": \"Flag to deactivate the rule\",\n                \"type\": \"boolean\"\n              },\n              \"ip_protocol\": {\n                \"description\": \"Type of IP packet that should be matched while enforcing the rule.\",\n                \"enum\": [\n                  \"IPV4\",\n                  \"IPV6\",\n                  \"IPV4_IPV6\"\n                ],\n                \"readOnly\": false,\n                \"title\": \"IPv4 vs IPv6 packet type\",\n                \"type\": \"string\"\n              },\n              \"is_default\": {\n                \"description\": \"A flag to indicate whether rule is a default rule.\",\n                \"readOnly\": true,\n                \"title\": \"Default rule flag\",\n                \"type\": \"boolean\"\n              },\n              \"logged\": {\n                \"default\": false,\n                \"description\": \"Flag to enable packet logging. Default is deactivated.\",\n                \"readOnly\": false,\n                \"title\": \"Enable logging flag\",\n                \"type\": \"boolean\"\n              },\n              \"notes\": {\n                \"description\": \"User level field which will be printed in CLI and packet logs.\\nThe notes field accepts up to 2048 characters. Internally,\\nnotes are truncated after 39 characters in CLI and packet logs.\\n\",\n                \"maxLength\": 2048,\n                \"readOnly\": false,\n                \"title\": \"Text for additional notes on changes\",\n                \"type\": \"string\"\n              },\n              \"profiles\": {\n                \"description\": \"Paths to context profile objects (PolicyContextProfile) or L7 access profile\\nobjects (L7AccessProfile) for advanced traffic inspection and filtering.\\nThese profiles enable matching on Layer 7 attributes and sub-attributes of\\nnetwork services such as:\\n- Application IDs (AppId)\\n- Encryption algorithms and TLS versions\\n- Domain names and URLs\\n- HTTP methods\\n- CIFS/SMB versions\\nYou can use either context profiles (PolicyContextProfile) or an\\nL7 access profile (L7AccessProfile), but not both.\\nWhen using an L7 access profile, only one profile path is allowed.\\n\",\n                \"items\": {\n                  \"type\": \"string\"\n                },\n                \"maxItems\": 128,\n                \"title\": \"Context profiles or L7 access profile paths\",\n                \"type\": \"array\"\n              },\n              \"rule_id\": {\n                \"description\": \"This is a unique positive integer identifier assigned by the system for each rule.\\nThe rule_id is passed down to the data path for rule matching and statistics.\\nThe system allocates rule IDs from a shared number space between Global Manager (GM) \\nand Local Manager (LM) using a zebra-style striped allocation:\\n- 1000 to 999,999: allocated by LM\\n- 1,000,000 to 1,999,999: allocated by GM\\n- 2,000,000 to 2,999,999: allocated by LM\\n- And so on, alternating in ranges of 1 million\\nThe rule_id is typically a small integer (1-4 digits for most deployments) rather \\nthan utilizing the full 32-bit range.\\n\",\n                \"format\": \"int64\",\n                \"readOnly\": true,\n                \"title\": \"Unique rule ID\",\n                \"type\": \"integer\"\n              },\n              \"scope\": {\n                \"description\": \"The list of group paths to which the rule applies. This determines\\nwhich workloads (VMs, containers, etc.) the rule is enforced on.\\nFor Gateway Firewall rules, this can also include Tier-0, Tier-1,\\nor interface paths to specify where the rule is enforced.\\nNote that a given rule can be applied to multiple groups or network entities.\\n\",\n                \"items\": {\n                  \"type\": \"string\"\n                },\n                \"maxItems\": 128,\n                \"type\": \"array\"\n              },\n              \"sequence_number\": {\n                \"description\": \"This field is used to resolve conflicts between multiple Rules under a Security\\nor Gateway Policy for a Domain. Rules are evaluated in ascending sequence number\\norder. If no sequence number is specified in the payload, the system assigns a\\ndefault value of 0. If there are multiple rules with the same sequence number\\nthen their order is not deterministic. If a specific order of rules is desired,\\nspecify unique sequence numbers or use the POST request on the rule entity with\\na query parameter action=revise to let the framework assign a sequence number.\\n\",\n                \"format\": \"int32\",\n                \"minimum\": 0,\n                \"title\": \"Sequence number of this Rule\",\n                \"type\": \"integer\"\n              },\n              \"service_entries\": {\n                \"description\": \"Can be used to specify raw service entries inline,\\nalong with \\\"services\\\", which contains paths to services.\\nThis can be empty or null.\\n\",\n                \"items\": {\n                  \"$ref\": \"#/components/schemas/ServiceEntry\"\n                },\n                \"maxItems\": 128,\n                \"title\": \"Raw service entries\",\n                \"type\": \"array\"\n              },\n              \"services\": {\n                \"description\": \"Paths to Service objects (e.g., \\\"/infra/services/HTTP\\\") that define\\nthe network services (protocols and ports) to which this rule applies.\\nIn order to specify all services, use the constant \\\"ANY\\\".\\nThis is case-insensitive. If \\\"ANY\\\" is used, it should\\nbe the ONLY element in the services array. Error will be thrown\\nif ANY is used in conjunction with other values.\\n\",\n                \"items\": {\n                  \"type\": \"string\"\n                },\n                \"maxItems\": 128,\n                \"title\": \"Service paths\",\n                \"type\": \"array\"\n              },\n              \"source_groups\": {\n                \"description\": \"Specifies the sources to match for this rule. This field accepts Group paths\\n(e.g., \\\"/infra/domains/default/groups/web-vms\\\") or direct IP addresses.\\nGroup paths reference Group objects that define collections of workloads.\\nIP addresses can be specified in CIDR notation, as individual addresses, or as ranges.\\nUse the constant \\\"ANY\\\" to match all sources. \\\"ANY\\\" is case-insensitive and must be\\nthe ONLY element in the array if used. An error will be thrown if \\\"ANY\\\" is used\\nin conjunction with other values.\\n\",\n                \"items\": {\n                  \"type\": \"string\"\n                },\n                \"maxItems\": 128,\n                \"title\": \"Source group paths\",\n                \"type\": \"array\"\n              },\n              \"sources_excluded\": {\n                \"default\": false,\n                \"description\": \"If set to true, the rule gets applied on all the groups that are\\nNOT part of the source groups. If false, the rule applies to the\\nsource groups\\n\",\n                \"readOnly\": false,\n                \"title\": \"Negation of source groups\",\n                \"type\": \"boolean\"\n              },\n              \"tag\": {\n                \"description\": \"User level field which will be printed in CLI and packet logs.\\nEven though there is no limitation on length of a tag, internally\\ntag will get truncated after 32 characters.\\n\",\n                \"title\": \"Tag applied on the rule\",\n                \"type\": \"string\"\n              }\n            },\n            \"type\": \"object\",\n            \"x-vmw-nsx-module\": \"Policy\"\n          }\n        ],\n        \"description\": \"A rule indicates the action to be performed for various types of traffic flowing between workload groups.\",\n        \"title\": \"A rule represents base properties for DFW, GFW, forwarding, and redirection rules\",\n        \"x-vmw-nsx-module\": \"Policy\"\n      },\n      \"BaseRuleListResult\": {\n        \"allOf\": [\n          {\n            \"$ref\": \"#/components/schemas/nsx_policy_api_42.ListResult\"\n          },\n          {\n            \"type\": \"object\",\n            \"x-vmw-nsx-module\": \"Policy\"\n          }\n        ],\n        \"description\": \"Paged Collection of Rules\",\n        \"title\": \"Paged Collection of Rules\",\n        \"x-vmw-nsx-module\": \"Policy\"\n      },\n      \"Policy\": {\n        \"allOf\": [\n          {\n            \"$ref\": \"#/components/schemas/nsx_policy_api_42.PolicyConfigResource\"\n          },\n          {\n            \"properties\": {\n              \"category\": {\n                \"description\": \"Classifies this security policy into an evaluation-priority category. Categories are\\nevaluated in a fixed priority order.\\n\\nDistributed Firewall (DFW) categories, in priority order (highest first):\\n  Ethernet - Layer 2 firewall rules only.\\n  Emergency - Highest priority L3 rules (common to both DFW and Edge FW).\\n  Infrastructure - Second priority L3 rules.\\n  Environment - Third priority L3 rules.\\n  Application - Lowest explicit L3 rules.\\n  ThreatRules - IDPS-only. Threat-based rules applied after Application.\\n  EmergencyThreatRules - IDPS-only. Highest priority threat-based rules.\\n\\nEdge (Gateway) Firewall categories, in priority order (highest first):\\n  Emergency, SystemRules, SharedPreRules, SharedExternalRules,\\n  LocalGatewayRules, AutoServiceRules, Default.\\n  For user-created domains, only SharedPreRules and LocalGatewayRules are allowed.\\n  If not specified, defaults to LocalGatewayRules.\\n\\nBridge Firewall category:\\n  LocalBridgeRules - Rules for bridge firewall policies.\\n\\nDistributed IDS/IPS (E-W IDPS) categories:\\n  ThreatRules - Threat-based IDS/IPS rules applied after Application.\\n  EmergencyThreatRules - Highest priority threat-based IDS/IPS rules.\\n\\nGateway IDS/IPS (N-S IDPS) category:\\n  LocalGatewayRules - IDS/IPS rules applied on the gateway.\\n\",\n                \"title\": \"Security policy category\",\n                \"type\": \"string\"\n              },\n              \"comments\": {\n                \"description\": \"Comments for security policy lock/unlock.\",\n                \"readOnly\": false,\n                \"title\": \"SecurityPolicy lock/unlock comments\",\n                \"type\": \"string\"\n              },\n              \"internal_sequence_number\": {\n                \"description\": \"This field is to indicate the internal sequence number of a policy\\nwith respect to the policies across categories.\\n\",\n                \"format\": \"int32\",\n                \"readOnly\": true,\n                \"title\": \"Internal sequence number\",\n                \"type\": \"integer\"\n              },\n              \"is_default\": {\n                \"description\": \"A flag to indicate whether policy is a default policy.\",\n                \"readOnly\": true,\n                \"title\": \"Default policy flag\",\n                \"type\": \"boolean\"\n              },\n              \"lock_modified_by\": {\n                \"description\": \"ID of the user who last modified the lock for the security policy.\\n\",\n                \"readOnly\": true,\n                \"title\": \"User who locked the security policy\",\n                \"type\": \"string\"\n              },\n              \"lock_modified_time\": {\n                \"description\": \"SecurityPolicy locked/unlocked time in epoch milliseconds.\",\n                \"format\": \"int64\",\n                \"readOnly\": true,\n                \"type\": \"integer\"\n              },\n              \"locked\": {\n                \"default\": false,\n                \"description\": \"Indicates whether a security policy should be locked. If the\\nsecurity policy is locked by a user, then no other user would\\nbe able to modify this security policy. Once the user releases\\nthe lock, other users can update this security policy.\\n\",\n                \"title\": \"Lock a security policy\",\n                \"type\": \"boolean\"\n              },\n              \"rule_count\": {\n                \"description\": \"The count of rules in the policy.\\n\",\n                \"format\": \"int32\",\n                \"readOnly\": true,\n                \"title\": \"Rule count\",\n                \"type\": \"integer\"\n              },\n              \"scheduler_path\": {\n                \"description\": \"Provides a mechanism to apply the rules in this policy for a specified\\ntime duration.\\n\",\n                \"readOnly\": false,\n                \"title\": \"Path to the scheduler for time based scheduling\",\n                \"type\": \"string\"\n              },\n              \"scope\": {\n                \"description\": \"The list of group paths where the rules in this policy will get\\napplied. Each path references a Group object that defines a collection\\nof workloads (VMs, containers, etc.). This scope determines which\\nworkloads the security policy's rules are enforced on.\\nThis scope will take precedence over rule level scope.\\nSupported only for security and redirection policies. In case of\\nRedirectionPolicy, it is expected only when the policy is NS and\\nredirecting to service chain.\\n\",\n                \"items\": {\n                  \"type\": \"string\"\n                },\n                \"maxItems\": 128,\n                \"type\": \"array\"\n              },\n              \"sequence_number\": {\n                \"description\": \"This field is used to resolve conflicts between security policies\\nacross domains. In order to change the sequence number of a policy\\none can fire a POST request on the policy entity with\\na query parameter action=revise\\nThe sequence number field will reflect the value of the computed\\nsequence number upon execution of the above mentioned POST request.\\nFor scenarios where the administrator is using a template to update\\nseveral security policies, the only way to set the sequence number is\\nto explicitly specify the sequence number for each security policy.\\nIf no sequence number is specified in the payload, a value of 0 is\\nassigned by default. If there are multiple policies with the same\\nsequence number then their order is not deterministic. If a specific\\norder of policies is desired, then one has to specify unique sequence\\nnumbers or use the POST request on the policy entity with\\na query parameter action=revise to let the framework assign a\\nsequence number.\\nThe value of sequence number must be between 0 and 999,999.\\n\",\n                \"format\": \"int32\",\n                \"minimum\": 0,\n                \"title\": \"Sequence number to resolve conflicts across Domains\",\n                \"type\": \"integer\"\n              },\n              \"stateful\": {\n                \"description\": \"Whether this security policy enforces stateful or stateless packet inspection.\\nWhen stateful (true), network connection state is tracked and stateful packet\\ninspection is performed. Layer-3 security policies default to stateful.\\nLayer-2 (Ethernet category) security policies must be stateless.\\nNote: when stateful is true, the tcp_strict field also defaults to true unless\\nexplicitly set to false. See the tcp_strict field for details.\\n\",\n                \"readOnly\": false,\n                \"title\": \"Stateful nature of this security policy\",\n                \"type\": \"boolean\"\n              },\n              \"tcp_strict\": {\n                \"description\": \"Enforces a 3-way TCP handshake before allowing data packets. Only applicable when\\nthe security policy is stateful. If not specified, the server automatically sets\\ntcp_strict to true for stateful policies and false for stateless policies.\\nSee also: stateful field.\\n\",\n                \"readOnly\": false,\n                \"title\": \"Enforce strict TCP handshake before allowing data\",\n                \"type\": \"boolean\"\n              }\n            },\n            \"type\": \"object\",\n            \"x-vmw-nsx-module\": \"Policy\"\n          }\n        ],\n        \"description\": \"Ordered list of Rules. This object is created by default along with the Domain.\\n\",\n        \"title\": \"Contains ordered list of Rules\",\n        \"x-vmw-nsx-module\": \"Policy\"\n      },\n      \"Rule\": {\n        \"allOf\": [\n          {\n            \"$ref\": \"#/components/schemas/BaseRule\"\n          },\n          {\n            \"properties\": {\n              \"action\": {\n                \"description\": \"The action to be applied to all the services.\\nREJECT is not allowed for Layer-2 (Ethernet category) rules -- use DROP instead.\\nJUMP_TO_APPLICATION is only valid for DFW rules (not Gateway Firewall) created\\nin the Environment category. Once a match is hit then the rule processing\\nwill jump to the rules present in the Application category, skipping\\nall further rules in the Environment category. If no rules match in\\nthe Application category then the default application rule will be hit.\\n\",\n                \"enum\": [\n                  \"ALLOW\",\n                  \"DROP\",\n                  \"REJECT\",\n                  \"JUMP_TO_APPLICATION\"\n                ],\n                \"title\": \"Action\",\n                \"type\": \"string\"\n              },\n              \"osi_layer\": {\n                \"description\": \"The OSI model layer at which this rule operates (L2 = Data Link Layer, L3 = Network Layer, L4 = Transport Layer, L7 = Application Layer).\",\n                \"enum\": [\n                  \"L2\",\n                  \"L3\",\n                  \"L4\",\n                  \"L7\"\n                ],\n                \"title\": \"OSI Layer\",\n                \"type\": \"string\"\n              }\n            },\n            \"type\": \"object\",\n            \"x-vmw-nsx-module\": \"Policy\"\n          }\n        ],\n        \"description\": \"A rule indicates the action to be performed for various types of traffic flowing between workload groups.\",\n        \"title\": \"A rule specifies the security policy rule between the workload groups\",\n        \"x-vmw-nsx-module\": \"Policy\"\n      },\n      \"RuleListResult\": {\n        \"allOf\": [\n          {\n            \"$ref\": \"#/components/schemas/BaseRuleListResult\"\n          },\n          {\n            \"properties\": {\n              \"results\": {\n                \"description\": \"Rule list results\",\n                \"items\": {\n                  \"$ref\": \"#/components/schemas/Rule\"\n                },\n                \"title\": \"Rule list results\",\n                \"type\": \"array\"\n              }\n            },\n            \"required\": [\n              \"results\"\n            ],\n            \"type\": \"object\",\n            \"x-vmw-nsx-module\": \"Policy\"\n          }\n        ],\n        \"description\": \"Paged Collection of Rules\",\n        \"title\": \"Paged Collection of Rules\",\n        \"x-vmw-nsx-module\": \"Policy\"\n      },\n      \"SecurityPolicy\": {\n        \"allOf\": [\n          {\n            \"$ref\": \"#/components/schemas/Policy\"\n          },\n          {\n            \"properties\": {\n              \"application_connectivity_strategy\": {\n                \"description\": \"This field indicates the application connectivity policy for the security\\npolicy.\\n\",\n                \"items\": {\n                  \"$ref\": \"#/components/schemas/ApplicationConnectivityStrategy\"\n                },\n                \"maxItems\": 3,\n                \"title\": \"List of Application Connectivity strategy for this SecurityPolicy\",\n                \"type\": \"array\"\n              },\n              \"category\": {\n                \"description\": \"Classifies this Distributed Firewall (DFW) security policy into a fixed evaluation\\ncategory. Categories are evaluated in priority order (highest precedence first).\\n\\nEthernet - Layer 2 firewall rules only. An Allow rule that matches in this category\\n  continues evaluation of the traffic for Layers 3-7 in the remaining categories below.\\nEmergency - Highest-precedence category for Layers 3-7 rules.\\nInfrastructure - Second priority for Layers 3-7 rules.\\nEnvironment - Third priority for Layers 3-7 rules.\\nApplication - Lowest priority for Layers 3-7 rules.\\n\\nIf omitted on create, the server assigns a default category (Application).\\n\",\n                \"enum\": [\n                  \"Ethernet\",\n                  \"Emergency\",\n                  \"Infrastructure\",\n                  \"Environment\",\n                  \"Application\"\n                ],\n                \"title\": \"Distributed Firewall policy category\",\n                \"type\": \"string\"\n              },\n              \"connectivity_preference\": {\n                \"description\": \"This field indicates the default connectivity policy for the security\\npolicy. Based on the connectivity preference, a default rule for this\\nsecurity policy will be created. An appropriate action will be set on\\nthe rule based on the value of the connectivity preference. If NONE is\\nselected or no connectivity preference is specified, then no default\\nrule for the security policy gets created. The default rule that gets\\ncreated will be a any-any rule and applied to entities specified in the\\nscope of the security policy. Specifying the connectivity_preference\\nwithout specifying the scope is not allowed. The scope has to be a\\nGroup and one cannot specify IPAddress directly in the group that is\\nused as scope. This default rule is only applicable for the Layer3\\nsecurity policies.\\nALLOWLIST - Adds a default drop rule. Administrator can then use \\\"allow\\\"\\nrules to allow traffic between groups\\nDENYLIST - Adds a default allow rule. Admin can then use \\\"drop\\\" rules\\nto block traffic between groups\\nALLOWLIST_ENABLE_LOGGING - Allowlisting with logging enabled\\nDENYLIST_ENABLE_LOGGING - Denylisting with logging enabled\\nNONE - No default rule is created.\\n\",\n                \"enum\": [\n                  \"ALLOWLIST\",\n                  \"DENYLIST\",\n                  \"ALLOWLIST_ENABLE_LOGGING\",\n                  \"DENYLIST_ENABLE_LOGGING\",\n                  \"NONE\"\n                ],\n                \"title\": \"Connectivity preference applicable for this SecurityPolicy\",\n                \"type\": \"string\"\n              },\n              \"default_rule_id\": {\n                \"description\": \"Based on the value of the connectivity_preference, a default rule is\\ncreated for the security policy. The rule id is internally assigned\\nby the system for this default rule.\\n\",\n                \"format\": \"int64\",\n                \"readOnly\": true,\n                \"title\": \"Default rule ID associated with the connectivity_preference\",\n                \"type\": \"integer\"\n              },\n              \"rules\": {\n                \"description\": \"Rules that are a part of this SecurityPolicy\",\n                \"items\": {\n                  \"$ref\": \"#/components/schemas/Rule\"\n                },\n                \"title\": \"Rules that are a part of this SecurityPolicy\",\n                \"type\": \"array\"\n              }\n            },\n            \"type\": \"object\",\n            \"x-vmw-nsx-module\": \"Policy\"\n          }\n        ],\n        \"description\": \"Distributed Firewall (DFW) Security Policy containing an ordered list of Rules for east-west traffic control between workloads.\\n\",\n        \"title\": \"Distributed Firewall Security Policy\",\n        \"x-vmw-nsx-module\": \"Policy\"\n      },\n      \"ServiceEntry\": {\n        \"allOf\": [\n          {\n            \"$ref\": \"#/components/schemas/nsx_policy_api_42.PolicyConfigResource\"\n          },\n          {\n            \"discriminator\": \"resource_type\",\n            \"properties\": {\n              \"resource_type\": {\n                \"description\": \"Discriminator identifying the concrete service entry type.\",\n                \"enum\": [\n                  \"IPProtocolServiceEntry\",\n                  \"IGMPType t\\nis deleted. Objects that are marked for deletion are not returned in\\nGET call. One can use the search API to get these objects.\\n\",\n                \"readOnly\": true,\n                \"title\": \"Indicates whether the intent object is marked for deletion\",\n                \"type\": \"boolean\"\n              },\n              \"overridden\": {\n                \"default\": false,\n                \"description\": \"Global intent objects cannot be modified by the user.\\nHowever, certain global intent objects can be overridden locally by use\\nof this property. In such cases, the overridden local values take\\nprecedence over the globally defined values for the properties.\\n\",\n                \"readOnly\": true,\n                \"title\": \"Indicates whether this object is the overridden intent object\",\n                \"type\": \"boolean\"\n              }\n            },\n            \"type\": \"object\",\n            \"x-vmw-nsx-module\": \"Policy\"\n          }\n        ],\n        \"description\": \"Represents an object on the desired state.\",\n        \"title\": \"Represents an object on the desired state\",\n        \"x-vmw-nsx-module\": \"Policy\"\n      },\n      \"nsx_policy_api_42.PolicyRequestParameter\": {\n        \"description\": \"Optional API Request Parameter to be used in HAPI.\",\n        \"discriminator\": \"resource_type\",\n        \"properties\": {\n          \"resource_type\": {\n            \"description\": \"The type of this request parameter.\",\n            \"readOnly\": false,\n            \"type\": \"string\"\n          }\n        },\n        \"required\": [\n          \"resource_type\"\n        ],\n        \"title\": \"Represents optional API request parameter to be used in HAPI\",\n        \"type\": \"object\",\n        \"x-vmw-nsx-module\": \"Policy\"\n      },\n      \"nsx_policy_api_42.PolicyResource\": {\n        \"allOf\": [\n          {\n            \"$ref\": \"#/components/schemas/nsx_policy_api_42.ManagedRe
