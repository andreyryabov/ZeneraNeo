        \"type\": \"string\"\n          }\n        },\n        \"title\": \"Arbitrary key-value pairs that may be attached to an entity\",\n        \"type\": \"object\",\n        \"x-vmw-nsx-module\": \"Common\"\n      }\n    }\n  }\n}\n{\n  \"openapi\": \"3.1.0\",\n  \"info\": {\n    \"title\": \"Selection\",\n    \"version\": \"0\"\n  },\n  \"paths\": {\n    \"/policy/api/v1/infra/domains/{domain-id}/security-policies\": {\n      \"get\": {\n        \"operationId\": \"_ListSecurityPoliciesForDomain\",\n        \"summary\": \"List distributed firewall security policies\",\n        \"description\": \"List all distributed firewall (DFW) security policies for a domain.\",\n        \"parameters\": [\n          {\n            \"name\": \"domain-id\",\n            \"in\": \"path\",\n            \"required\": true,\n            \"schema\": {\n              \"type\": \"string\"\n            }\n          },\n          {\n            \"name\": \"cursor\",\n            \"in\": \"query\",\n            \"required\": false,\n            \"description\": \"Opaque cursor to be used for getting next page of records (supplied by current result page)\",\n            \"schema\": {\n              \"type\": \"string\"\n            }\n          },\n          {\n            \"name\": \"include_mark_for_delete_objects\",\n            \"in\": \"query\",\n            \"required\": false,\n            \"description\": \"If true, resources that are marked for deletion will be included\\nin the results. By default, these resources are not included.\",\n            \"schema\": {\n              \"default\": false,\n              \"type\": \"boolean\"\n            }\n          },\n          {\n            \"name\": \"include_rule_count\",\n            \"in\": \"query\",\n            \"required\": false,\n            \"description\": \"If true, populate the rule_count field with the count of rules in\\nthe particular policy. By default, rule_count will not be populated.\",\n            \"schema\": {\n              \"default\": false,\n              \"type\": \"boolean\"\n            }\n          },\n          {\n            \"name\": \"page_size\",\n            \"in\": \"query\",\n            \"required\": false,\n            \"description\": \"Maximum number of results to return in this page (server may return fewer)\",\n            \"schema\": {\n              \"default\": 1000,\n              \"format\": \"int64\",\n              \"maximum\": 1000,\n              \"minimum\": 0,\n              \"type\": \"integer\"\n            }\n          },\n          {\n            \"name\": \"sort_ascending\",\n            \"in\": \"query\",\n            \"required\": false,\n            \"description\": \"If true, results are sorted in ascending order\",\n            \"schema\": {\n              \"type\": \"boolean\"\n            }\n          },\n          {\n            \"name\": \"sort_by\",\n            \"in\": \"query\",\n            \"required\": false,\n            \"description\": \"Field by which records are sorted\",\n            \"schema\": {\n              \"type\": \"string\"\n            }\n          }\n        ],\n        \"responses\": {\n          \"200\": {\n            \"description\": \"OK\",\n            \"content\": {\n              \"application/json\": {\n                \"schema\": {\n                  \"$ref\": \"#/components/schemas/SecurityPolicyListResult\"\n                }\n              }\n            }\n          }\n        }\n      }\n    },\n    \"/policy/api/v1/infra/domains/{domain-id}/security-policies/{security-policy-id}\": {\n      \"get\": {\n        \"operationId\": \"_ReadSecurityPolicyForDomain\",\n        \"summary\": \"Read a distributed firewall security policy\",\n        \"description\": \"Read a distributed firewall (DFW) security policy for a domain.\",\n        \"parameters\": [\n          {\n            \"name\": \"domain-id\",\n            \"in\": \"path\",\n            \"required\": true,\n            \"schema\": {\n              \"type\": \"string\"\n            }\n          },\n          {\n            \"name\": \"security-policy-id\",\n            \"in\": \"path\",\n            \"required\": true,\n            \"schema\": {\n              \"type\": \"string\"\n            }\n          }\n        ],\n        \"responses\": {\n          \"200\": {\n            \"description\": \"OK\",\n            \"content\": {\n              \"application/json\": {\n                \"schema\": {\n                  \"$ref\": \"#/components/schemas/SecurityPolicy\"\n                }\n              }\n            }\n          }\n        }\n      }\n    }\n  },\n  \"components\": {\n    \"schemas\": {\n      \"ApplicationConnectivityStrategy\": {\n        \"description\": \"Allows more granular policies for application workloads\\n\",\n        \"properties\": {\n          \"application_connectivity_strategy\": {\n            \"description\": \"App connectivity strategies\\n\",\n            \"enum\": [\n              \"ALLOW_INTRA\",\n              \"ALLOW_EGRESS\",\n              \"ALLOW_INGRESS\",\n              \"DROP_INGRESS\",\n              \"DROP_EGRESS\"\n            ],\n            \"title\": \"Application connectivity strategy\",\n            \"type\": \"string\"\n          },\n          \"default_application_rule_id\": {\n            \"description\": \"Based on the value of the app connectivity strategy, a default rule is\\ncreated for the security policy. The rule id is internally assigned\\nby the system for this default rule.\\n\",\n            \"format\": \"int64\",\n            \"readOnly\": true,\n            \"title\": \"Default rule ID associated with the application_connectivity_strategy\",\n            \"type\": \"integer\"\n          },\n          \"logging_enabled\": {\n            \"default\": false,\n            \"description\": \"Flag to enable packet logging. Default is deactivated.\",\n            \"readOnly\": false,\n            \"title\": \"Enable logging flag\",\n            \"type\": \"boolean\"\n          }\n        },\n        \"required\": [\n          \"application_connectivity_strategy\"\n        ],\n        \"title\": \"Application specific connectivity strategy\",\n        \"type\": \"object\",\n        \"x-vmw-nsx-module\": \"Policy\"\n      },\n      \"BaseRule\": {\n        \"allOf\": [\n          {\n            \"$ref\": \"#/components/schemas/nsx_policy_api_42.PolicyConfigResource\"\n          },\n          {\n            \"properties\": {\n              \"destination_groups\": {\n                \"description\": \"Specifies the destinations to match for this rule. This field accepts Group paths\\n(e.g., \\\"/infra/domains/default/groups/db-vms\\\") or direct IP addresses.\\nGroup paths reference Group objects that define collections of workloads.\\nIP addresses can be specified in CIDR notation, as individual addresses, or as ranges.\\nUse the constant \\\"ANY\\\" to match all destinations. \\\"ANY\\\" is case-insensitive and must be\\nthe ONLY element in the array if used. An error will be thrown if \\\"ANY\\\" is used\\nin conjunction with other values.\\n\",\n                \"items\": {\n                  \"type\": \"string\"\n                },\n                \"maxItems\": 128,\n                \"title\": \"Destination group paths\",\n                \"type\": \"array\"\n              },\n              \"destinations_excluded\": {\n                \"default\": false,\n                \"description\": \"If set to true, the rule gets applied on all the groups that are\\nNOT part of the destination groups. If false, the rule applies to the\\ndestination groups\\n\",\n                \"readOnly\": false,\n                \"title\": \"Negation of destination groups\",\n                \"type\": \"boolean\"\n              },\n              \"direction\": {\n                \"default\": \"IN_OUT\",\n                \"description\": \"Specifies the direction of traffic to which this rule applies:\\n- IN: Applies to incoming traffic only (traffic coming into the workload)\\n- OUT: Applies to outgoing traffic only (traffic leaving the workload)\\n- IN_OUT: Applies to both incoming and outgoing traffic (default)\\n\",\n                \"enum\": [\n                  \"IN\",\n                  \"OUT\",\n                  \"IN_OUT\"\n                ],\n                \"title\": \"Direction\",\n                \"type\": \"string\"\n              },\n              \"disabled\": {\n                \"default\": false,\n                \"description\": \"Flag to deactivate the rule. Default is activated.\",\n                \"readOnly\": false,\n                \"title\": \"Flag to deactivate the rule\",\n                \"type\": \"boolean\"\n              },\n              \"ip_protocol\": {\n                \"description\": \"Type of IP packet that should be matched while enforcing the rule.\",\n                \"enum\": [\n                  \"IPV4\",\n                  \"IPV6\",\n                  \"IPV4_IPV6\"\n                ],\n                \"readOnly\": false,\n                \"title\": \"IPv4 vs IPv6 packet type\",\n                \"type\": \"string\"\n              },\n              \"is_default\": {\n                \"description\": \"A flag to indicate whether rule is a default rule.\",\n                \"readOnly\": true,\n                \"title\": \"Default rule flag\",\n                \"type\": \"boolean\"\n              },\n              \"logged\": {\n                \"default\": false,\n                \"description\": \"Flag to enable packet logging. Default is deactivated.\",\n                \"readOnly\": false,\n                \"title\": \"Enable logging flag\",\n                \"type\": \"boolean\"\n              },\n              \"notes\": {\n                \"description\": \"User level field which will be printed in CLI and packet logs.\\nThe notes field accepts up to 2048 characters. Internally,\\nnotes are truncated after 39 characters in CLI and packet logs.\\n\",\n                \"maxLength\": 2048,\n                \"readOnly\": false,\n                \"title\": \"Text for additional notes on changes\",\n                \"type\": \"string\"\n              },\n              \"profiles\": {\n                \"description\": \"Paths to context profile objects (PolicyContextProfile) or L7 access profile\\nobjects (L7AccessProfile) for advanced traffic inspection and filtering.\\nThese profiles enable matching on Layer 7 attributes and sub-attributes of\\nnetwork services such as:\\n- Application IDs (AppId)\\n- Encryption algorithms and TLS versions\\n- Domain names and URLs\\n- HTTP methods\\n- CIFS/SMB versions\\nYou can use either context profiles (PolicyContextProfile) or an\\nL7 access profile (L7AccessProfile), but not both.\\nWhen using an L7 access profile, only one profile path is allowed.\\n\",\n                \"items\": {\n                  \"type\": \"string\"\n                },\n                \"maxItems\": 128,\n                \"title\": \"Context profiles or L7 access profile paths\",\n                \"type\": \"array\"\n              },\n              \"rule_id\": {\n                \"description\": \"This is a unique positive integer identifier assigned by the system for each rule.\\nThe rule_id is passed down to the data path for rule matching and statistics.\\nThe system allocates rule IDs from a shared number space between Global Manager (GM) \\nand Local Manager (LM) using a zebra-style striped allocation:\\n- 1000 to 999,999: allocated by LM\\n- 1,000,000 to 1,999,999: allocated by GM\\n- 2,000,000 to 2,999,999: allocated by LM\\n- And so on, alternating in ranges of 1 million\\nThe rule_id is typically a small integer (1-4 digits for most deployments) rather \\nthan utilizing the full 32-bit range.\\n\",\n                \"format\": \"int64\",\n                \"readOnly\": true,\n                \"title\": \"Unique rule ID\",\n                \"type\": \"integer\"\n              },\n              \"scope\": {\n                \"description\": \"The list of group paths to which the rule applies. This determines\\nwhich workloads (VMs, containers, etc.) the rule is enforced on.\\nFor Gateway Firewall rules, this can also include Tier-0, Tier-1,\\nor interface paths to specify where the rule is enforced.\\nNote that a given rule can be applied to multiple groups or network entities.\\n\",\n                \"items\": {\n                  \"type\": \"string\"\n                },\n                \"maxItems\": 128,\n                \"type\": \"array\"\n              },\n              \"sequence_number\": {\n                \"description\": \"This field is used to resolve conflicts between multiple Rules under a Security\\nor Gateway Policy for a Domain. Rules are evaluated in ascending sequence number\\norder. If no sequence number is specified in the payload, the system assigns a\\ndefault value of 0. If there are multiple rules with the same sequence number\\nthen their order is not deterministic. If a specific order of rules is desired,\\nspecify unique sequence numbers or use the POST request on the rule entity with\\na query parameter action=revise to let the framework assign a sequence number.\\n\",\n                \"format\": \"int32\",\n                \"minimum\": 0,\n                \"title\": \"Sequence number of this Rule\",\n                \"type\": \"integer\"\n              },\n              \"service_entries\": {\n                \"description\": \"Can be used to specify raw service entries inline,\\nalong with \\\"services\\\", which contains paths to services.\\nThis can be empty or null.\\n\",\n                \"items\": {\n                  \"$ref\": \"#/components/schemas/ServiceEntry\"\n                },\n                \"maxItems\": 128,\n                \"title\": \"Raw service entries\",\n                \"type\": \"array\"\n              },\n              \"services\": {\n                \"description\": \"Paths to Service objects (e.g., \\\"/infra/services/HTTP\\\") that define\\nthe network services (protocols and ports) to which this rule applies.\\nIn order to specify all services, use the constant \\\"ANY\\\".\\nThis is case-insensitive. If \\\"ANY\\\" is used, it should\\nbe the ONLY element in the services array. Error will be thrown\\nif ANY is used in conjunction with other values.\\n\",\n                \"items\": {\n                  \"type\": \"string\"\n                },\n                \"maxItems\": 128,\n                \"title\": \"Service paths\",\n                \"type\": \"array\"\n              },\n              \"source_groups\": {\n                \"description\": \"Specifies the sources to match for this rule. This field accepts Group paths\\n(e.g., \\\"/infra/domains/default/groups/web-vms\\\") or direct IP addresses.\\nGroup paths reference Group objects that define collections of workloads.\\nIP addresses can be specified in CIDR notation, as individual addresses, or as ranges.\\nUse the constant \\\"ANY\\\" to match all sources. \\\"ANY\\\" is case-insensitive and must be\\nthe ONLY element in the array if used. An error will be thrown if \\\"ANY\\\" is used\\nin conjunction with other values.\\n\",\n                \"items\": {\n                  \"type\": \"string\"\n                },\n                \"maxItems\": 128,\n                \"title\": \"Source group paths\",\n                \"type\": \"array\"\n              },\n              \"sources_excluded\": {\n                \"default\": false,\n                \"description\": \"If set to true, the rule gets applied on all the groups that are\\nNOT part of the source groups. If false, the rule applies to the\\nsource groups\\n\",\n                \"readOnly\": false,\n                \"title\": \"Negation of source groups\",\n                \"type\": \"boolean\"\n              },\n              \"tag\": {\n                \"description\": \"User level field which will be printed in CLI and packet logs.\\nEven though there is no limitation on length of a tag, internally\\ntag will get truncated after 32 characters.\\n\",\n                \"title\": \"Tag applied on the rule\",\n                \"type\": \"string\"\n              }\n            },\n            \"type\": \"object\",\n            \"x-vmw-nsx-module\": \"Policy\"\n          }\n        ],\n        \"description\": \"A rule indicates the action to be performed for various types of traffic flowing between workload groups.\",\n        \"title\": \"A rule represents base properties for DFW, GFW, forwarding, and redirection rules\",\n        \"x-vmw-nsx-module\": \"Policy\"\n      },\n      \"Policy\": {\n        \"allOf\": [\n          {\n            \"$ref\": \"#/components/schemas/nsx_policy_api_42.PolicyConfigResource\"\n          },\n          {\n            \"properties\": {\n              \"category\": {\n                \"description\": \"Classifies this security policy into an evaluation-priority category. Categories are\\nevaluated in a fixed priority order.\\n\\nDistributed Firewall (DFW) categories, in priority order (highest first):\\n  Ethernet - Layer 2 firewall rules only.\\n  Emergency - Highest priority L3 rules (common to both DFW and Edge FW).\\n  Infrastructure - Second priority L3 rules.\\n  Environment - Third priority L3 rules.\\n  Application - Lowest explicit L3 rules.\\n  ThreatRules - IDPS-only. Threat-based rules applied after Application.\\n  EmergencyThreatRules - IDPS-only. Highest priority threat-based rules.\\n\\nEdge (Gateway) Firewall categories, in priority order (highest first):\\n  Emergency, SystemRules, SharedPreRules, SharedExternalRules,\\n  LocalGatewayRules, AutoServiceRules, Default.\\n  For user-created domains, only SharedPreRules and LocalGatewayRules are allowed.\\n  If not specified, defaults to LocalGatewayRules.\\n\\nBridge Firewall category:\\n  LocalBridgeRules - Rules for bridge firewall policies.\\n\\nDistributed IDS/IPS (E-W IDPS) categories:\\n  ThreatRules - Threat-based IDS/IPS rules applied after Application.\\n  EmergencyThreatRules - Highest priority threat-based IDS/IPS rules.\\n\\nGateway IDS/IPS (N-S IDPS) category:\\n  LocalGatewayRules - IDS/IPS rules applied on the gateway.\\n\",\n                \"title\": \"Security policy category\",\n                \"type\": \"string\"\n              },\n              \"comments\": {\n                \"description\": \"Comments for security policy lock/unlock.\",\n                \"readOnly\": false,\n                \"title\": \"SecurityPolicy lock/unlock comments\",\n                \"type\": \"string\"\n              },\n              \"internal_sequence_number\": {\n                \"description\": \"This field is to indicate the internal sequence number of a policy\\nwith respect to the policies across categories.\\n\",\n                \"format\": \"int32\",\n                \"readOnly\": true,\n                \"title\": \"Internal sequence number\",\n                \"type\": \"integer\"\n              },\n              \"is_default\": {\n                \"description\": \"A flag to indicate whether policy is a default policy.\",\n                \"readOnly\": true,\n                \"title\": \"Default policy flag\",\n                \"type\": \"boolean\"\n              },\n              \"lock_modified_by\": {\n                \"description\": \"ID of the user who last modified the lock for the security policy.\\n\",\n                \"readOnly\": true,\n                \"title\": \"User who locked the security policy\",\n                \"type\": \"string\"\n              },\n              \"lock_modified_time\": {\n                \"description\": \"SecurityPolicy locked/unlocked time in epoch milliseconds.\",\n                \"format\": \"int64\",\n                \"readOnly\": true,\n                \"type\": \"integer\"\n              },\n              \"locked\": {\n                \"default\": false,\n                \"description\": \"Indicates whether a security policy should be locked. If the\\nsecurity policy is locked by a user, then no other user would\\nbe able to modify this security policy. Once the user releases\\nthe lock, other users can update this security policy.\\n\",\n                \"title\": \"Lock a security policy\",\n                \"type\": \"boolean\"\n              },\n              \"rule_count\": {\n                \"description\": \"The count of rules in the policy.\\n\",\n                \"format\": \"int32\",\n                \"readOnly\": true,\n                \"title\": \"Rule count\",\n                \"type\": \"integer\"\n              },\n              \"scheduler_path\": {\n                \"description\": \"Provides a mechanism to apply the rules in this policy for a specified\\ntime duration.\\n\",\n                \"readOnly\": false,\n                \"title\": \"Path to the scheduler for time based scheduling\",\n                \"type\": \"string\"\n              },\n              \"scope\": {\n                \"description\": \"The list of group paths where the rules in this policy will get\\napplied. Each path references a Group object that defines a collection\\nof workloads (VMs, containers, etc.). This scope determines which\\nworkloads the security policy's rules are enforced on.\\nThis scope will take precedence over rule level scope.\\nSupported only for security and redirection policies. In case of\\nRedirectionPolicy, it is expected only when the policy is NS and\\nredirecting to service chain.\\n\",\n                \"items\": {\n                  \"type\": \"string\"\n                },\n                \"maxItems\": 128,\n                \"type\": \"array\"\n              },\n              \"sequence_number\": {\n                \"description\": \"This field is used to resolve conflicts between security policies\\nacross domains. In order to change the sequence number of a policy\\none can fire a POST request on the policy entity with\\na query parameter action=revise\\nThe sequence number field will reflect the value of the computed\\nsequence number upon execution of the above mentioned POST request.\\nFor scenarios where the administrator is using a template to update\\nseveral security policies, the only way to set the sequence number is\\nto explicitly specify the sequence number for each security policy.\\nIf no sequence number is specified in the payload, a value of 0 is\\nassigned by default. If there are multiple policies with the same\\nsequence number then their order is not deterministic. If a specific\\norder of policies is desired, then one has to specify unique sequence\\nnumbers or use the POST request on the policy entity with\\na query parameter action=revise to let the framework assign a\\nsequence number.\\nThe value of sequence number must be between 0 and 999,999.\\n\",\n                \"format\": \"int32\",\n                \"minimum\": 0,\n                \"title\": \"Sequence number to resolve conflicts across Domains\",\n                \"type\": \"integer\"\n              },\n              \"stateful\": {\n                \"description\": \"Whether this security policy enforces stateful or stateless packet inspection.\\nWhen stateful (true), network connection state is tracked and stateful packet\\ninspection is performed. Layer-3 security policies default to stateful.\\nLayer-2 (Ethernet category) security policies must be stateless.\\nNote: when stateful is true, the tcp_strict field also defaults to true unless\\nexplicitly set to false. See the tcp_strict field for details.\\n\",\n                \"readOnly\": false,\n                \"title\": \"Stateful nature of this security policy\",\n                \"type\": \"boolean\"\n              },\n              \"tcp_strict\": {\n                \"description\": \"Enforces a 3-way TCP handshake before allowing data packets. Only applicable when\\nthe security policy is stateful. If not specified, the server automatically sets\\ntcp_strict to true for stateful policies and false for stateless policies.\\nSee also: stateful field.\\n\",\n                \"readOnly\": false,\n                \"title\": \"Enforce strict TCP handshake before allowing data\",\n                \"type\": \"boolean\"\n              }\n            },\n            \"type\": \"object\",\n            \"x-vmw-nsx-module\": \"Policy\"\n          }\n        ],\n        \"description\": \"Ordered list of Rules. This object is created by default along with the Domain.\\n\",\n        \"title\": \"Contains ordered list of Rules\",\n        \"x-vmw-nsx-module\": \"Policy\"\n      },\n      \"PolicyListResult\": {\n        \"allOf\": [\n          {\n            \"$ref\": \"#/components/schemas/nsx_policy_api_42.ListResult\"\n          },\n          {\n            \"type\": \"object\",\n            \"x-vmw-nsx-module\": \"Policy\"\n          }\n        ],\n        \"description\": \"Paged Collection of security policies\",\n        \"title\": \"Paged Collection of security policies\",\n        \"x-vmw-nsx-module\": \"Policy\"\n      },\n      \"Rule\": {\n        \"allOf\": [\n          {\n            \"$ref\": \"#/components/schemas/BaseRule\"\n          },\n          {\n            \"properties\": {\n              \"action\": {\n                \"description\": \"The action to be applied to all the services.\\nREJECT is not allowed for Layer-2 (Ethernet category) rules -- use DROP instead.\\nJUMP_TO_APPLICATION is only valid for DFW rules (not Gateway Firewall) created\\nin the Environment category. Once a match is hit then the rule processing\\nwill jump to the rules present in the Application category, skipping\\nall further rules in the Environment category. If no rules match in\\nthe Application category then the default application rule will be hit.\\n\",\n                \"enum\": [\n                  \"ALLOW\",\n                  \"DROP\",\n                  \"REJECT\",\n                  \"JUMP_TO_APPLICATION\"\n                ],\n                \"title\": \"Action\",\n                \"type\": \"string\"\n              },\n              \"osi_layer\": {\n                \"description\": \"The OSI model layer at which this rule operates (L2 = Data Link Layer, L3 = Network Layer, L4 = Transport Layer, L7 = Application Layer).\",\n                \"enum\": [\n                  \"L2\",\n                  \"L3\",\n                  \"L4\",\n                  \"L7\"\n                ],\n                \"title\": \"OSI Layer\",\n                \"type\": \"string\"\n              }\n            },\n            \"type\": \"object\",\n            \"x-vmw-nsx-module\": \"Policy\"\n          }\n        ],\n        \"description\": \"A rule indicates the action to be performed for various types of traffic flowing between workload groups.\",\n        \"title\": \"A rule specifies the security policy rule between the workload groups\",\n        \"x-vmw-nsx-module\": \"Policy\"\n      },\n      \"SecurityPolicy\": {\n        \"allOf\": [\n          {\n            \"$ref\": \"#/components/schemas/Policy\"\n          },\n          {\n            \"properties\": {\n              \"application_connectivity_strategy\": {\n                \"description\": \"This field indicates the application connectivity policy for the security\\npolicy.\\n\",\n                \"items\": {\n                  \"$ref\": \"#/components/schemas/ApplicationConnectivityStrategy\"\n                },\n                \"maxItems\": 3,\n                \"title\": \"List of Application Connectivity strategy for this SecurityPolicy\",\n                \"type\": \"array\"\n              },\n              \"category\": {\n                \"description\": \"Classifies this Distributed Firewall (DFW) security policy into a fixed evaluation\\ncategory. Categories are evaluated in priority order (highest precedence first).\\n\\nEthernet - Layer 2 firewall rules only. An Allow rule that matches in this category\\n  continues evaluation of the traffic for Layers 3-7 in the remaining categories below.\\nEmergency - Highest-precedence category for Layers 3-7 rules.\\nInfrastructure - Second priority for Layers 3-7 rules.\\nEnvironment - Third priority for Layers 3-7 rules.\\nApplication - Lowest priority for Layers 3-7 rules.\\n\\nIf omitted on create, the server assigns a default category (Application).\\n\",\n                \"enum\": [\n                  \"Ethernet\",\n                  \"Emergency\",\n                  \"Infrastructure\",\n                  \"Environment\",\n                  \"Application\"\n                ],\n                \"title\": \"Distributed Firewall policy category\",\n                \"type\": \"string\"\n              },\n              \"connectivity_preference\": {\n                \"description\": \"This field indicates the default connectivity policy for the security\\npolicy. Based on the connectivity preference, a default rule for this\\nsecurity policy will be created. An appropriate action will be set on\\nthe rule based on the value of the connectivity preference. If NONE is\\nselected or no connectivity preference is specified, then no default\\nrule for the security policy gets created. The default rule that gets\\ncreated will be a any-any rule and applied to entities specified in the\\nscope of the security policy. Specifying the connectivity_preference\\nwithout specifying the scope is not allowed. The scope has to be a\\nGroup and one cannot specify IPAddress directly in the group that is\\nused as scope. This default rule is only applicable for the Layer3\\nsecurity policies.\\nALLOWLIST - Adds a default drop rule. Administrator can then use \\\"allow\\\"\\nrules to allow traffic between groups\\nDENYLIST - Adds a default allow rule. Admin can then use \\\"drop\\\" rules\\nto block traffic between groups\\nALLOWLIST_ENABLE_LOGGING - Allowlisting with logging enabled\\nDENYLIST_ENABLE_LOGGING - Denylisting with logging enabled\\nNONE - No default rule is created.\\n\",\n                \"enum\": [\n                  \"ALLOWLIST\",\n                  \"DENYLIST\",\n                  \"ALLOWLIST_ENABLE_LOGGING\",\n                  \"DENYLIST_ENABLE_LOGGING\",\n                  \"NONE\"\n                ],\n                \"title\": \"Connectivity preference applicable for this SecurityPolicy\",\n                \"type\": \"string\"\n              },\n              \"default_rule_id\": {\n                \"description\": \"Based on the value of the connectivity_preference, a default rule is\\ncreated for the security policy. The rule id is internally assigned\\nby the system for this default rule.\\n\",\n                \"format\": \"int64\",\n                \"readOnly\": true,\n                \"title\": \"Default rule ID associated with the connectivity_preference\",\n                \"type\": \"integer\"\n              },\n              \"rules\": {\n                \"description\": \"Rules that are a part of this SecurityPolicy\",\n                \"items\": {\n                  \"$ref\": \"#/components/schemas/Rule\"\n                },\n                \"title\": \"Rules that are a part of this SecurityPolicy\",\n                \"type\": \"array\"\n              }\n            },\n            \"type\": \"object\",\n            \"x-vmw-nsx-module\": \"Policy\"\n          }\n        ],\n        \"description\": \"Distributed Firewall (DFW) Security Policy containing an ordered list of Rules for east-west traffic control between workloads.\\n\",\n        \"title\": \"Distributed Firewall Security Policy\",\n        \"x-vmw-nsx-module\": \"Policy\"\n      },\n      \"SecurityPolicyListResult\": {\n        \"allOf\": [\n          {\n            \"$ref\": \"#/components/schemas/PolicyListResult\"\n          },\n          {\n            \"properties\": {\n              \"results\": {\n                \"description\": \"SecurityPolicy list results\",\n                \"items\": {\n                  \"$ref\": \"#/components/schemas/SecurityPolicy\"\n                },\n                \"title\": \"SecurityPolicy list results\",\n                \"type\": \"array\"\n              }\n            },\n            \"required\": [\n              \"results\"\n            ],\n            \"type\": \"object\",\n            \"x-vmw-nsx-module\": \"Policy\"\n          }\n        ],\n        \"description\": \"Paged Collection of security policies\",\n        \"title\": \"Paged Collection of security policies\",\n        \"x-vmw-nsx-module\": \"Policy\"\n      },\n      \"ServiceEntry\": {\n        \"allOf\": [\n          {\n            \"$ref\": \"#/components/schemas/nsx_policy_api_42.PolicyConfigResource\"\n          },\n          {\n            \"discriminator\": \"resource_type\",\n            \"properties\": {\n              \"resource_type\": {\n                \"description\": \"Discriminator identifying the concrete service entry type.\",\n                \"enum\": [\n                  \"IPProtocolServiceEntry\",\n                  \"IGMPTypeServiceEntry\",\n                  \"ICMPTypeServiceEntry\",\n                  \"ALGTypeServiceEntry\",\n                  \"L4PortSetServiceEntry\",\n                  \"EtherTypeServiceEntry\",\n                  \"NestedServiceServiceEntry\"\n                ],\n                \"type\": \"string\"\n              }\n            },\n            \"required\": [\n              \"resource_type\"\n            ],\n            \"type\": \"object\",\n            \"x-vmw-nsx-module\": \"Policy\"\n          }\n        ],\n        \"description\": \"Base type for a service entry. Each concrete subtype is identified by its `resource_type` field.\\nCheck `resource_type` before accessing subtype-specific fields\",\n        \"title\": \"A Service entry that describes traffic\",\n        \"x-vmw-nsx-module\": \"Policy\"\n      },\n      \"nsx_policy_api_42.ChildPolicyConfigResource\": {\n        \"allOf\": [\n <script type="module">
const MERMAID_URL = "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

const DATA = JSON.parse(document.getElementById('memory-data').textContent);
const NODES = DATA.nodes;
const EDGES = DATA.edges;
const BY_ID = new Map(NODES.map(function (n) { return [n.id, n]; }));

// Short synthetic keys, stable across redraws, because a Mermaid id has to
// survive being pasted into a DOM id and read back out of one.
const KEY = new Map();
const ID = new Map();
NODES.forEach(function (n, i) { KEY.set(n.id, 'n' + i); ID.set('n' + i, n.id); });

const ADJ = new Map();
function adj(id) {
  if (!ADJ.has(id)) ADJ.set(id, []);
  return ADJ.get(id);
}
EDGES.forEach(function (e) {
  adj(e.source).push({ other: e.target, rel: e.relation, out: true });
  adj(e.target).push({ other: e.source, rel: e.relation, out: false });
});

let sel = null;

// --- small builders -------------------------------------------------------

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function short(id) { return id.length > 10 ? id.slice(0, 4) + '…' + id.slice(-4) : id; }

function clip(s, n) {
  const one = String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
  return one.length > n ? one.slice(0, n - 1) + '…' : one;
}

function bytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KiB';
  return (n / 1048576).toFixed(1) + ' MiB';
}

/** Timestamps are read to answer "is this still current?", which an ISO string
 *  makes you do arithmetic for. The exact value stays, as the title. */
function ago(iso) {
  const t = Date.parse(iso);
  if (!t) return iso || '—';
  const s = (Date.now() - t) / 1000;
  if (s < 90) return 'just now';
  if (s < 5400) return Math.round(s / 60) + ' min ago';
  if (s < 172800) return Math.round(s / 3600) + ' h ago';
  if (s < 5184000) return Math.round(s / 86400) + ' days ago';
  return new Date(t).toISOString().slice(0, 10);
}

/**
 * Text as at most 'max' lines of roughly 'width' characters. A diagram label is
 * one long line otherwise, and Mermaid will not break it: every node ends up as
 * wide as its sentence and the graph is unreadable at any zoom that fits.
 */
function wrap(text, width, max) {
  const words = String(text == null ? '' : text).replace(/\s+/g, ' ').trim().split(' ');
  const out = [];
  let cur = '';
  let i = 0;
  for (; i < words.length; i++) {
    const w = words[i].length > width ? words[i].slice(0, width - 1) + '…' : words[i];
    if (!w) continue;
    if (!cur) cur = w;
    else if (cur.length + 1 + w.length <= width) cur += ' ' + w;
    else if (out.length + 1 < max) { out.push(cur); cur = w; }
    else break;
  }
  if (cur) out.push(cur);
  const last = out.length - 1;
  if (i < words.length && last >= 0 && out[last].slice(-1) !== '…') out[last] += '…';
  return out;
}

function block(title, tag) {
  const s = el('section', 'blk');
  const h = el('h3', null, title);
  if (tag) h.appendChild(el('span', 'tag', tag));
  s.appendChild(h);
  return s;
}

function textBlock(title, body, tag) {
  const s = block(title, tag);
  if (body) s.appendChild(el('pre', null, body));
  else s.appendChild(el('div', 'empty', 'empty'));
  return s;
}

function prop(list, key, value, title) {
  list.appendChild(el('dt', null, key));
  const d = el('dd', null, value);
  if (title) d.title = title;
  list.appendChild(d);
}

// --- header ---------------------------------------------------------------

(function head() {
  const h = document.getElementById('head');
  h.appendChild(el('h1', null, DATA.title));
  const bits = [
    ['nodes', String(NODES.length)],
    ['edges', String(EDGES.length)],
  ];
  if (DATA.embedding) {
    bits.push(['embedding', DATA.embedding.model + ' · ' + DATA.embedding.dimensions + 'd']);
  } else {
    bits.push(['embedding', 'none — recall falls back to term overlap']);
  }
  if (DATA.vectors) bits.push(['vectors', DATA.vectors.rows + ' rows · ' + bytes(DATA.vectors.bytes)]);
  bits.push(['dir', DATA.dir]);
  bits.forEach(function (b) {
    const s = el('span', 'kv');
    s.appendChild(document.createTextNode(b[0] + ' '));
    s.appendChild(el('b', null, b[1]));
    h.appendChild(s);
  });
  // A vector row per node is the healthy state; anything else means a commit
  // ran without an embedder and that memory cannot be found by meaning.
  if (DATA.vectors && DATA.vectors.rows !== NODES.length) {
    h.appendChild(el('span', 'badge warn',
      '⚠ ' + (NODES.length - DATA.vectors.rows) + ' node(s) have no vector'));
  }
})();

// --- filters --------------------------------------------------------------

const q = document.getElementById('q');
const kindSel = document.getElementById('kind');
const audSel = document.getElementById('aud');
const filesOnly = document.getElementById('files');
const staleOnly = document.getElementById('stale');
const orphansOnly = document.getElementById('orphans');
const focusSel = document.getElementById('focus');

DATA.kinds.forEach(function (k) { kindSel.appendChild(new Option(k, k)); });
DATA.audiences.forEach(function (a) { audSel.appendChild(new Option(a, a)); });

function matches(n) {
  if (kindSel.value && n.kind !== kindSel.value) return false;
  if (audSel.value && n.audience.indexOf(audSel.value) < 0) return false;
  if (filesOnly.checked && !n.file) return false;
  if (staleOnly.checked && !n.stale) return false;
  if (orphansOnly.checked && n.degree !== 0) return false;
  const term = q.value.trim().toLowerCase();
  if (!term) return true;
  return haystack(n).indexOf(term) >= 0;
}

function haystack(n) {
  if (n._hay == null) {
    n._hay = [n.id, n.kind, n.text, n.audience.join(' '),
      n.file ? n.file.path : '', n.metadata ? JSON.stringify(n.metadata) : '']
      .join(' ').toLowerCase();
  }
  return n._hay;
}

function visible() { return NODES.filter(matches); }

[q, kindSel, audSel, filesOnly, staleOnly, orphansOnly].forEach(function (c) {
  c.addEventListener('input', refresh);
});
focusSel.addEventListener('input', drawGraph);

// --- the list -------------------------------------------------------------

function renderList() {
  const list = document.getElementById('list');
  const rows = visible();
  list.replaceChildren();
  if (!rows.length) {
    list.appendChild(el('li', 'hint pad', NODES.length ? 'nothing matches' : 'this memory is empty'));
    return;
  }
  rows.forEach(function (n) {
    const li = el('li', n.stale ? 'stale' : null);
    li.dataset.id = n.id;
    if (n.id === sel) li.classList.add('sel');
    const row = el('div', 'row');
    row.appendChild(el('span', 'kind ' + n.kind, n.kind));
    if (n.file) row.appendChild(el('span', 'badge', '⎘ ' + n.file.format));
    row.appendChild(el('span', 'id', short(n.id)));
    li.appendChild(row);
    li.appendChild(el('div', 'prev', clip(n.text, 90)));
    li.addEventListener('click', function () { select(n.id); });
    list.appendChild(li);
  });
}

// --- the detail pane ------------------------------------------------------

function renderDetail() {
  const pane = document.getElementById('detail');
  pane.replaceChildren();
  const n = sel && BY_ID.get(sel);
  if (!n) {
    pane.appendChild(el('div', 'hint pad', 'Pick a node.'));
    return;
  }
  const body = el('div', 'body');

  const h = el('div', 'dt');
  h.appendChild(el('span', 'kind ' + n.kind, n.kind));
  if (n.file) h.appendChild(el('span', 'badge', '⎘ ' + n.file.format));
  if (n.stale) h.appendChild(el('span', 'badge warn', 'superseded'));
  body.appendChild(h);

  // The id is the thing you carry to 'zen memory show', so it is whole, on its
  // own line, and takeable in one click.
  const idrow = el('div', 'idrow');
  idrow.appendChild(el('code', null, n.id));
  const copy = el('button', null, 'copy');
  copy.addEventListener('click', function () {
    navigator.clipboard.writeText(n.id).then(function () {
      copy.textContent = 'copied';
      setTimeout(function () { copy.textContent = 'copy'; }, 1200);
    }, function () { copy.textContent = 'blocked'; });
  });
  idrow.appendChild(copy);
  body.appendChild(idrow);

  const props = el('dl', 'props');
  prop(props, 'audience', n.audience.join(', ') || '—');
  prop(props, 'recalled', n.useCount + '× · last ' + ago(n.lastUsedAt), n.lastUsedAt);
  prop(props, 'created', ago(n.createdAt), n.createdAt);
  if (n.updatedAt !== n.createdAt) prop(props, 'updated', ago(n.updatedAt), n.updatedAt);
  prop(props, 'revision', String(n.revision));
  body.appendChild(props);

  body.appendChild(textBlock('Text', n.text));

  if (n.metadata) {
    body.appendChild(textBlock('Metadata', JSON.stringify(n.metadata, null, 2)));
  }

  if (n.file) {
    const tag = n.file.path + ' · ' + bytes(n.file.bytes);
    if (n.image) {
      const s = block('File', tag);
      const img = el('img', 'media');
      img.src = n.image;
      img.alt = n.file.path;
      s.appendChild(img);
      body.appendChild(s);
    } else if (n.content != null) {
      body.appendChild(textBlock('File', n.content, tag));
    } else {
      const s = block('File', tag);
      s.appendChild(el('div', 'empty', EXCUSE[n.omitted] || 'not shown'));
      body.appendChild(s);
    }
    body.appendChild(textBlock('Digest', n.file.sha256));
  }

  const links = adj(n.id);
  const s = block('Links', String(links.length));
  if (!links.length) {
    s.appendChild(el('div', 'empty', 'nothing points here and it points nowhere'));
  } else {
    const ul = el('ul', 'links');
    // Outgoing first: PRODUCED read forwards is the story of the node, and
    // mixing the two directions made every row need reading twice.
    links.slice().sort(function (a, b) { return (a.out ? 0 : 1) - (b.out ? 0 : 1); })
      .forEach(function (l) {
        const other = BY_ID.get(l.other);
        const li = el('li');
        li.appendChild(el('span', 'rel', (l.out ? '→ ' : '← ') + l.rel));
        li.appendChild(el('span', 'kind ' + (other ? other.kind : ''), other ? other.kind : '?'));
        const b = el('button', 'link', other ? clip(other.text, 70) || short(l.other) : short(l.other));
        b.title = l.other;
        b.addEventListener('click', function () { select(l.other); });
        li.appendChild(b);
        ul.appendChild(li);
      });
    s.appendChild(ul);
  }
  body.appendChild(s);
  pane.appendChild(body);
}

const EXCUSE = {
  'too-big': 'too big to inline — read it from the memory directory',
  binary: 'binary, so there is nothing to show',
  missing: 'the graph records this file but it is not on disk',
  unreadable: 'on disk but could not be read'
};

// --- selection ------------------------------------------------------------

function select(id, fromGraph) {
  sel = id;
  renderList();
  renderDetail();
  const li = document.querySelector('#list li[data-id="' + cssEscape(id) + '"]');
  if (li) li.scrollIntoView({ block: 'nearest' });
  if (focusSel.value !== 'all') drawGraph();
  else markSelected();
  if (!fromGraph) reveal(id);
}

function cssEscape(v) { return String(v).replace(/["\\]/g, '\\$&'); }

function markSelected() {
  const key = sel && KEY.get(sel);
  document.querySelectorAll('.canvas .node').forEach(function (g) {
    g.classList.toggle('picked', keyOf(g) === key);
  });
}

/** Scrolls a node into view in the diagram, when it is drawn at all. */
function reveal(id) {
  const key = KEY.get(id);
  const g = [].find.call(document.querySelectorAll('.canvas .node'), function (x) {
    return keyOf(x) === key;
  });
  if (g) g.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

function refresh() {
  renderList();
  drawGraph();
}

// --- the diagram ----------------------------------------------------------

// Past this Mermaid produces something no one can read and takes a long time
// doing it. The filters and the hop focus are the way through, so the pane
// says so rather than hanging.
const MAX_GRAPH_NODES = 300;

const SHAPES = { file: ['[/', '/]'], plan: ['{{', '}}'], operation: ['([', '])'] };
const PAINTED = new Set(['task', 'plan', 'fact', 'snippet', 'file', 'operation', 'preference']);

// Labels are ids, closed-vocabulary kinds, and a clip of text stripped to a
// conservative character set: nothing a model wrote reaches the Mermaid parser
// with its punctuation intact, let alone the SVG. The ellipsis and the middle
// dot are in the set because the label is built out of them — stripping them
// turned '01M2…ERNE' into '01M2 ERNE', which reads as two words, not one id.
function safe(text) {
  return String(text).replace(/[^\w .,:!?'·…\-\/>+=()%]/g, ' ').replace(/\s+/g, ' ').trim();
}

/**
 * One node's label: what it is on the first line, what it says underneath.
 * Run together on a single line there was no telling the id from the kind from
 * the text, which is the whole complaint about reading these diagrams.
 */
function label(id, n) {
  const head = safe(n.kind + ' · ' + short(id)) + (n.file ? ' · ' + safe(n.file.format) : '');
  return [head].concat(wrap(n.text, 28, 3).map(safe)).join('<br/>');
}

/** The nodes to draw: what the filters left, optionally narrowed to a neighbourhood. */
function scope() {
  const shown = new Set(visible().map(function (n) { return n.id; }));
  const hops = focusSel.value;
  if (hops === 'all' || !sel) return shown;
  const keep = new Set([sel]);
  let edge = [sel];
  for (let i = 0; i < Number(hops); i++) {
    const next = [];
    edge.forEach(function (id) {
      adj(id).forEach(function (l) {
        if (!keep.has(l.other)) { keep.add(l.other); next.push(l.other); }
      });
    });
    edge = next;
  }
  return keep;
}

function diagram(ids) {
  const lines = ['graph LR'];
  lines.push('  classDef task fill:#1e3357,stroke:#3d5f9e,color:#cfe0ff;');
  lines.push('  classDef plan fill:#3a2450,stroke:#6b4b90,color:#e6d3ff;');
  lines.push('  classDef fact fill:#14392c,stroke:#2f7a5c,color:#c6f5e0;');
  lines.push('  classDef snippet fill:#1e3d33,stroke:#3d7a66,color:#c8f0e2;');
  lines.push('  classDef file fill:#40331a,stroke:#7a6535,color:#f0dfb4;');
  lines.push('  classDef operation fill:#3d2a1b,stroke:#7a5535,color:#f2d9c2;');
  lines.push('  classDef preference fill:#3d1f2c,stroke:#7a3b56,color:#f5b8cd;');
  lines.push('  classDef stale opacity:0.45,stroke-dasharray:4 3;');
  ids.forEach(function (id) {
    const n = BY_ID.get(id);
    if (!n) return;
    const k = KEY.get(id);
    const shape = SHAPES[n.kind] || ['(', ')'];
    lines.push('  ' + k + shape[0] + '"' + label(id, n) + '"' + shape[1]);
    // Kinds are configurable, so a project can have one this page has no
    // colour for; naming a class that was never defined fails the render.
    if (PAINTED.has(n.kind)) lines.push('  class ' + k + ' ' + n.kind + ';');
    if (n.stale) lines.push('  class ' + k + ' stale;');
  });
  EDGES.forEach(function (e) {
    if (!ids.has(e.source) || !ids.has(e.target)) return;
    lines.push('  ' + KEY.get(e.source) + ' -->|' + e.relation + '| ' + KEY.get(e.target));
  });
  return lines.join('\n');
}

function keyOf(g) {
  // Mermaid ids are '<renderId>-<ourKey>-<seq>'; only the key matters.
  const m = /-(n\d+)-\d+$/.exec(g.id || '');
  return m ? m[1] : null;
}

let mermaidLib = null;
function mermaid() {
  if (!mermaidLib) {
    mermaidLib = import(MERMAID_URL).then(function (m) {
      m.default.initialize({
        startOnLoad: false, theme: 'dark', securityLevel: 'strict',
        maxEdges: 20000, maxTextSize: 5000000,
        flowchart: { htmlLabels: false, nodeSpacing: 45, rankSpacing: 80, useMaxWidth: false }
      });
      return m.default;
    });
  }
  return mermaidLib;
}

const canvas = document.querySelector('.canvas');
const gcount = document.getElementById('gcount');
let drawSeq = 0;

async function drawGraph() {
  const ids = scope();
  gcount.textContent = ids.size + ' of ' + NODES.length + ' shown';
  if (!ids.size) {
    canvas.replaceChildren(el('div', 'hint pad', 'nothing to draw'));
    return;
  }
  if (ids.size > MAX_GRAPH_NODES) {
    canvas.replaceChildren(el('div', 'hint pad',
      ids.size + ' nodes is more than this pane can draw legibly. Narrow it with the'
      + ' filters on the left, or pick a node and switch to a hop view above.'));
    return;
  }
  const seq = ++drawSeq;
  let lib;
  try {
    lib = await mermaid();
  } catch (err) {
    canvas.replaceChildren(el('div', 'hint pad',
      'Mermaid could not be loaded (offline?). The list and the detail pane still work.'));
    return;
  }
  let rendered;
  try {
    rendered = await lib.render('memory-graph-' + seq, diagram(ids));
  } catch (err) {
    canvas.replaceChildren(el('pre', null, 'diagram failed: ' + err.message));
    return;
  }
  if (seq !== drawSeq) return;
  // Mermaid produced this markup from labels sanitized above; no node text and
  // no file content reaches it.
  canvas.innerHTML = rendered.svg;
  const svg = canvas.querySelector('svg');
  if (svg) {
    const box = svg.viewBox && svg.viewBox.baseVal;
    const w = (box && box.width) || svg.getBoundingClientRect().width;
    const h = (box && box.height) || svg.getBoundingClientRect().height;
    svg.removeAttribute('width');
    svg.removeAttribute('height');
    svg.style.maxWidth = 'none';
    svg.style.width = w + 'px';
    svg.style.height = h + 'px';
    natural = { w: w, h: h };
  }
  canvas.querySelectorAll('.node').forEach(function (g) {
    const key = keyOf(g);
    const id = key && ID.get(key);
    if (id) g.dataset.node = id;
  });
  markSelected();
  // A redraw changes how much there is to see, so a view nobody has touched
  // should follow it.
  if (auto) fit();
}

// --- pan and zoom ---------------------------------------------------------

const viewport = document.querySelector('.viewport');
const level = document.querySelector('.lvl');
let scale = 1, tx = 0, ty = 0, natural = { w: 0, h: 0 }, moved = false;
// While true the view is the page's to choose; the first manual zoom or pan
// hands it to the operator and we stop moving it under them.
let auto = true;

function applyView() {
  canvas.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
  level.textContent = Math.round(scale * 100) + '%';
}

function zoomAt(factor, cx, cy) {
  auto = false;
  const next = Math.min(4, Math.max(0.05, scale * factor));
  const k = next / scale;
  tx = cx - k * (cx - tx);
  ty = cy - k * (cy - ty);
  scale = next;
  applyView();
}

function fit() {
  if (!natural.w) return;
  const r = viewport.getBoundingClientRect();
  // A pane can be narrower than the padding it wants; clamped, because a scale
  // at or below zero renders the diagram as nothing at all.
  scale = Math.max(0.05, Math.min((r.width - 24) / natural.w, (r.height - 24) / natural.h, 1));
  tx = Math.max(0, (r.width - natural.w * scale) / 2);
  ty = 12;
  auto = true;
  applyView();
}

// The pane is a grid column, so it resizes with the window and with nothing
// else; a scale measured against its old width would be wrong from then on.
if (window.ResizeObserver) {
  new ResizeObserver(function () { if (auto) fit(); }).observe(viewport);
}

document.querySelector('.gtools').addEventListener('click', function (ev) {
  const what = ev.target.dataset && ev.target.dataset.zoom;
  if (!what) return;
  const r = viewport.getBoundingClientRect();
  if (what === 'in') zoomAt(1.25, r.width / 2, r.height / 2);
  else if (what === 'out') zoomAt(0.8, r.width / 2, r.height / 2);
  else if (what === 'fit') fit();
  else { auto = false; scale = 1; tx = 0; ty = 0; applyView(); }
});

viewport.addEventListener('wheel', function (ev) {
  ev.preventDefault();
  const r = viewport.getBoundingClientRect();
  zoomAt(ev.deltaY < 0 ? 1.1 : 0.9, ev.clientX - r.left, ev.clientY - r.top);
}, { passive: false });

viewport.addEventListener('dblclick', fit);

let dragging = false, sx = 0, sy = 0, downOn = null;
viewport.addEventListener('pointerdown', function (ev) {
  // The node under the press is recorded here because capturing the pointer
  // retargets the click that follows onto the viewport: a listener on the node
  // itself never hears it, which is why picking one did nothing.
  downOn = ev.target && ev.target.closest ? ev.target.closest('.node') : null;
  dragging = true; moved = false; sx = ev.clientX - tx; sy = ev.clientY - ty;
  viewport.classList.add('drag');
  viewport.setPointerCapture(ev.pointerId);
});
viewport.addEventListener('pointermove', function (ev) {
  if (!dragging) return;
  const nx = ev.clientX - sx, ny = ev.clientY - sy;
  if (Math.abs(nx - tx) + Math.abs(ny - ty) > 3) { moved = true; auto = false; }
  tx = nx; ty = ny;
  applyView();
});
function endDrag(ev) {
  if (!dragging) return;
  dragging = false;
  viewport.classList.remove('drag');
  if (viewport.hasPointerCapture(ev.pointerId)) viewport.releasePointerCapture(ev.pointerId);
  // A press that did not turn into a drag is a pick.
  const hit = downOn;
  downOn = null;
  if (!moved && hit && hit.dataset.node) select(hit.dataset.node, true);
  // Let the click that ends a drag pass without selecting.
  setTimeout(function () { moved = false; }, 0);
}
viewport.addEventListener('pointerup', endDrag);
viewport.addEventListener('pointercancel', endDrag);

// --- go -------------------------------------------------------------------

renderList();
renderDetail();
drawGraph().then(fit);

</script>
</body>
</html>
