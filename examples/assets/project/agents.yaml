version: 1

# The agent a conversation starts with. Without this the first entry wins,
# which makes file order load-bearing — better to say it.
default: intake

# Named connections. A second key for the same vendor is a second *name*, not a
# second copy of the credentials on every model that uses it — and one client is
# built per name and shared, so five agents on one key open one connection pool.
#
# `${VAR}` reads the environment; `${VAR:-fallback}` supplies a default. None of
# it is resolved until an agent actually reaches for the provider, so this file
# may name a vendor a given deployment has no key for.
#
# `openai`, `google`, `vertex`, `anthropic` and `openai-compatible` work with no
# entry at all; these exist because they say something the defaults do not.
providers:
    openai-eu:
        baseURL: https://eu.api.openai.com/v1
        apiKey: ${OPENAI_API_KEY_EU}
    gemini:
        # The Gemini API, reached with Google's own SDK rather than their
        # OpenAI-compatible shim — which is what makes thinking budgets,
        # thought summaries and cached-content accounting reachable at all.
        kind: google
        apiKey: ${GEMINI_API_KEY}
    vertex-eu:
        # The same models billed through a GCP project. No key: the SDK
        # resolves Application Default Credentials and refreshes them itself.
        kind: vertex
        project: ${GOOGLE_CLOUD_PROJECT}
        location: europe-west4
    claude:
        kind: anthropic
        apiKey: ${ANTHROPIC_API_KEY}

# Named model configurations. `model:` below takes one of these names, or falls
# through to the `[provider[/api]:]model` shorthand.
models:
    fast: openai/responses:gpt-5.4-mini
    careful:
        provider: openai
        api: responses
        model: gpt-5.4
        reasoningEffort: high
    second-opinion: gemini:gemini-2.5-pro
    # Gemini 3 dials thinking by level where 2.5 took a token budget.
    grounded:
        provider: vertex-eu
        model: gemini-3-pro-preview
        thinkingLevel: high
    deliberate:
        provider: claude
        model: claude-sonnet-4-5
        # Anthropic requires an output cap, and bills thinking against it.
        maxTokens: 16000

# Fallback for agents that do not pin their own.
model: fast

# One catalog, scanned once. `.agents/skills` is the default, written out here
# so the layout is visible from the config alone.
skills: .agents/skills

agents:
    - name: intake
      description: Takes the first message, gets the claim reference, routes the case.
      system: .agents/prompts/intake.md
      tools: [policy_lookup]
      handoffs: [adjuster]

    - name: adjuster
      description: Applies the written peril policies to a claim and explains the outcome.
      system: .agents/prompts/adjuster.md
      skills:
          # Names and descriptions go into the system prompt, so the agent can
          # see what exists and pull the one the case needs.
          discovery: index
          # Active before the first call, every turn this agent owns. It is
          # tone, not knowledge: there is no case where the model would decide
          # it does not need it, so making it choose is a wasted round trip.
          preload: [house_style]
