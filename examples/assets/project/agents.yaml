version: 1

# The agent a conversation starts with. Without this the first entry wins,
# which makes file order load-bearing — better to say it.
default: intake

# No `providers:` block at all.
#
# `openai`, `google`, `vertex`, `anthropic` and `openai-compatible` are built-in
# names as well as kinds, so `vertex` resolves with nothing declared — and
# vertex is the one kind that needs no api key: the GenAI SDK resolves and
# refreshes Application Default Credentials itself. Here that is the service
# account key file named by GOOGLE_APPLICATION_CREDENTIALS, which also supplies
# the project id, so GOOGLE_CLOUD_PROJECT need not be set.
#
# A block would only be needed to pin a region, name a second project, or hold
# a key — none of which applies when the ambient credentials are the whole
# story. One client is built for the name and shared by every model below.

# Named model configurations. `model:` below takes one of these names, or falls
# through to the `[provider[/api]:]model` shorthand.
models:
    router:
        provider: vertex
        model: gemini-3.5-flash-lite
        thinkingLevel: minimal
    # A step up for work that has to weigh written policy against a case.
    balanced:
        provider: vertex
        model: gemini-3.5-flash
        thinkingLevel: high

# Fallback for agents that do not pin their own.
model: router

# One catalog, scanned once. `agents/skills` is the default, written out here
# so the layout is visible from the config alone.
skills: agents/skills

agents:
    - name: intake
      description: Takes the first message, gets the claim reference, routes the case.
      system: agents/prompts/intake.md
      model: router
      tools: [policy_lookup]
      handoffs: [adjuster]

    - name: adjuster
      description: Applies the written peril policies to a claim and explains the outcome.
      system: agents/prompts/adjuster.md
      model: balanced
      skills:
          # Names and descriptions go into the system prompt, so the agent can
          # see what exists and pull the one the case needs.
          discovery: index
          # Active before the first call, every turn this agent owns. It is
          # tone, not knowledge: there is no case where the model would decide
          # it does not need it, so making it choose is a wasted round trip.
          preload: [house_style]
